<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rigframe · 原型 v0.2</title>
<style>
  :root{
    --bg:#151515; --panel:#1c1c1c; --panel2:#242424; --panel3:#2c2c2c;
    --line:#303030; --line2:#3d3d3d;
    --text:#e9e9e6; --muted:#8d8d88; --dim:#6a6a65;
    --accent:#5DCAA5; --accent2:#85B7EB; --warn:#F0997B; --danger:#E24B4A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:12px; -webkit-font-smoothing:antialiased; user-select:none;
  }
  #app{display:grid; grid-template-rows:46px 1fr var(--foot, 206px); height:100%}
  #app.propen{--foot:calc(236px + var(--prh, 136px))}
  @media (max-height:860px){
    #app.propen{--foot:calc(226px + var(--prh, 110px))}
  }

  header{display:flex; align-items:center; gap:8px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--line)}
  .brand{font-size:12px; font-weight:500; letter-spacing:.02em; white-space:nowrap}
  .brand em{font-style:normal; color:var(--dim); margin-left:7px; font-size:10px; font-weight:400}
  .vline{width:1px; height:20px; background:var(--line); margin:0 4px}
  .spacer{flex:1}

  button{
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:5px; padding:5px 10px; font-size:11px; cursor:pointer;
    font-family:inherit; white-space:nowrap; transition:background .1s,border-color .1s,color .1s;
  }
  button:hover{background:#333; border-color:var(--line2)}
  button:active{background:#3a3a3a}
  button.primary{background:#1d4d3e; border-color:#2f6f59; color:#d6f5e9}
  button.primary:hover{background:#236050}
  button.on{background:#3a2f1c; border-color:#7a5f33; color:#f5d9a8}
  button.ghost{background:transparent; border-color:transparent; color:var(--muted)}
  button.ghost:hover{background:var(--panel2); color:var(--text)}
  button:disabled{opacity:.35; cursor:default}
  button.mini{padding:2px 6px; font-size:10px; border-radius:4px}

  input[type=number],input[type=text]{
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:5px; padding:4px 6px; font-size:11px; font-family:inherit; width:100%;
  }
  input:focus{outline:none; border-color:#4a6f60}
  select{
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:5px; padding:4px 6px; font-size:11px; font-family:inherit; width:100%;
  }
  input[type=range]{accent-color:var(--accent); height:3px; width:100%}
  input[type=color]{background:transparent; border:1px solid var(--line); border-radius:5px; width:30px; height:24px; padding:1px; cursor:pointer}

  main{display:grid; grid-template-columns:252px minmax(0,1fr) 286px; grid-template-rows:1fr; min-height:0}

  aside{background:var(--panel); display:flex; flex-direction:column; min-height:0}
  #layers{border-right:1px solid var(--line)}
  #inspector{border-left:1px solid var(--line)}

  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px 7px; font-size:10px; letter-spacing:.09em; color:var(--dim);
    text-transform:uppercase; border-bottom:1px solid var(--line); flex:none;
  }
  .panel-body{overflow-y:auto; flex:1; min-height:0; scrollbar-width:thin; scrollbar-color:#3f3f3f transparent}
  .panel-body::-webkit-scrollbar{width:9px}
  .panel-body::-webkit-scrollbar-track{background:transparent}
  .panel-body::-webkit-scrollbar-thumb{background:#3f3f3f; border-radius:5px; border:2px solid var(--panel)}
  .panel-body::-webkit-scrollbar-thumb:hover{background:#555}
  .panel-foot{padding:7px; border-top:1px solid var(--line); display:flex; gap:5px; flex:none}

  .layer{
    display:flex; align-items:center; gap:6px; padding:4px 9px; cursor:pointer;
    border-left:2px solid transparent; position:relative;
  }
  .layer:hover{background:#232323}
  .layer.sel{background:#2a2a2a; border-left-color:var(--accent)}
  .layer.drop-top{box-shadow:inset 0 2px 0 var(--accent2)}
  .layer.dragging{opacity:.4}
  .layer .chev{width:11px; flex:none; color:var(--dim); font-size:9px; text-align:center; line-height:1}
  .layer .chev:hover{color:var(--text)}
  .layer .chev-space{width:11px; flex:none}
  .layer.child::before{
    content:""; position:absolute; left:15px; top:0; bottom:0; width:1px; background:#2e2e2e;
  }
  .layer .thumb{
    width:26px; height:26px; border-radius:4px; background:#111; flex:none;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    border:1px solid #2e2e2e; position:relative;
  }
  .layer .thumb img{max-width:100%; max-height:100%; display:block}
  .layer.folder .thumb{border-color:#5a5a52}
  .layer.folder .thumb::before{
    content:""; position:absolute; left:2px; top:-1px; width:11px; height:3px;
    background:#5a5a52; border-radius:2px 2px 0 0;
  }
  .layer.folder .lname{font-weight:500}
  .layer .lname{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11.5px}
  .layer .lname input{font-size:11.5px; padding:1px 3px}
  .layer .tog{
    width:18px; height:18px; border-radius:3px; display:flex; align-items:center; justify-content:center;
    color:var(--dim); font-size:10px; flex:none;
  }
  .layer .tog:hover{background:#383838; color:var(--text)}
  .layer .tog.off{color:#4a4a46}
  .layer .badge{font-size:9px; color:var(--dim); background:#2b2b2b; padding:0 4px; border-radius:3px; flex:none}
  .layer .pin{font-size:9px; color:#6f6f68; flex:none}
  .lempty{padding:26px 12px; text-align:center; font-size:11px; color:#57574f; line-height:1.9}

  #layerTabs{
    display:flex; align-items:center; gap:2px; padding:0 8px; height:28px;
    border-bottom:1px solid var(--line); flex:none; background:var(--panel);
  }
  #layerTabs .ltab{
    padding:3px 9px 4px; font-size:11px; color:var(--dim); cursor:pointer;
    border-radius:4px 4px 0 0; border-bottom:2px solid transparent; line-height:1.4;
  }
  #layerTabs .ltab:hover{color:var(--text); background:#232323}
  #layerTabs .ltab.on{color:var(--text); border-bottom-color:var(--accent); background:#252525}
  #layerTabs .cnt{margin-left:auto; font-size:10px; color:var(--dim); letter-spacing:0}

  #prbar{
    display:flex; align-items:center; gap:6px; padding:0 10px; height:30px;
    border-bottom:1px solid var(--line); flex:none; overflow-x:auto; overflow-y:hidden; min-width:0;
  }
  #prbar::-webkit-scrollbar{height:0}
  #prbar .lbl{font-size:10.5px; color:var(--dim); flex:none; white-space:nowrap}
  #prbar select{flex:none}
  #prwrap{flex:none; height:0; overflow:hidden; border-bottom:1px solid var(--line); background:#141414}
  #prwrap.open{height:var(--prh, 136px)}
  @media (max-height:860px){ #prwrap.open{height:var(--prh, 110px)} }
  #pr{display:block; width:100%; height:100%; cursor:default}

  #stage{position:relative; background:#0d0d0d; overflow:hidden; min-width:0; min-height:0}
  #view{display:block; width:100%; height:100%}
  #hint{position:absolute; left:12px; bottom:10px; font-size:10.5px; color:#565651; line-height:1.65; pointer-events:none}
  #drop{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:8px; color:#5a5a55; font-size:11.5px; text-align:center; line-height:1.8;
    pointer-events:none;
  }
  #drop b{color:#9a9a95; font-weight:500; font-size:13px}
  #drop.over{background:#182722}
  #drop button{pointer-events:auto; margin-top:4px}
  #toast{
    position:absolute; left:50%; top:16px; transform:translateX(-50%);
    background:#243a33; color:#c9f0e2; border:1px solid #37695a; padding:6px 14px;
    border-radius:6px; font-size:11.5px; opacity:0; transition:opacity .2s; pointer-events:none;
  }
  #toast.show{opacity:1}
  #dropZone{
    position:fixed; inset:0; z-index:300; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:6px;
    background:rgba(8,16,13,.86); border:2px dashed #3f7a66; color:#cfe9de;
    font-size:14px; pointer-events:none;
  }
  #dropZone.on{display:flex}
  #dropZone small{color:#7fa093;font-size:11.5px}
  #ctxMenu{
    position:fixed; z-index:400; display:none; background:#262626;
    border:1px solid #3f3f3f; border-radius:7px; padding:4px; min-width:132px;
    box-shadow:0 8px 26px rgba(0,0,0,.55);
  }
  #ctxMenu .mi{padding:5px 10px; font-size:11.5px; border-radius:4px; cursor:pointer; color:#ddd; display:flex; justify-content:space-between; gap:14px}
  #ctxMenu .mi:hover{background:#343434}
  #ctxMenu .mi.dim{color:#5f5f5a; pointer-events:none}
  #ctxMenu .mi em{font-style:normal; color:#6f6f69; font-size:10px}
  #ctxMenu hr{border:0; border-top:1px solid #383838; margin:4px 2px}
  #modal{
    position:fixed; inset:0; z-index:500; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.55);
  }
  #modal.show{display:flex}
  #modal .mbox{
    width:300px; background:#242424; border:1px solid #3f3f3f; border-radius:9px;
    padding:16px; box-shadow:0 18px 50px rgba(0,0,0,.6);
  }
  #modal h3{font-size:13px; font-weight:500; margin-bottom:12px; color:#e9e9e6}
  #modal input{width:100%; margin-bottom:14px}
  #modal .mfoot{display:flex; justify-content:flex-end; gap:8px}
  .card{position:relative}
  .card .del{
    position:absolute; top:1px; right:4px; font-size:11px; color:#6a6a65;
    line-height:1; padding:2px; border-radius:3px;
  }
  .card .del:hover{color:#E24B4A; background:#3a2323}
  #expModal{
    position:fixed; inset:0; z-index:520; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.55);
  }
  #expModal.show{display:flex}
  #expModal .mbox{width:340px; background:#242424; border:1px solid #3f3f3f; border-radius:9px; padding:16px; box-shadow:0 18px 50px rgba(0,0,0,.6)}
  #expModal h3{font-size:13px; font-weight:500; margin-bottom:12px}
  .erow{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  .erow label{width:44px; color:var(--muted); font-size:11px; flex:none}
  .erow select{flex:1}
  .erow .ev{color:#b9b9b4; font-size:11px; flex:1}
  .ebar{height:4px; background:#333; border-radius:2px; overflow:hidden; margin:12px 0 7px}
  .ebar i{display:block; height:100%; width:0; background:var(--accent); transition:width .12s}
  .estat{font-size:10.5px; color:var(--dim); margin-bottom:12px; min-height:14px}

  .tabs{display:flex; border-bottom:1px solid var(--line); flex:none}
  .tab{flex:1; text-align:center; padding:8px 0; font-size:11px; color:var(--dim); cursor:pointer; border-bottom:2px solid transparent}
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--text); border-bottom-color:var(--accent)}

  .sec{padding:9px 10px 4px; font-size:10px; letter-spacing:.08em; color:var(--dim); text-transform:uppercase}
  .row{display:flex; align-items:center; gap:7px; padding:3px 10px}
  .row>label{width:46px; color:var(--muted); font-size:10.5px; flex:none}
  .row .val{width:38px; text-align:right; color:#b9b9b4; font-variant-numeric:tabular-nums; font-size:10.5px; flex:none}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:5px; padding:3px 10px}
  .chk{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--muted); padding:3px 10px; cursor:pointer}

  .variants{display:flex; gap:5px; flex-wrap:wrap; padding:3px 10px 6px}
  .vitem{
    width:42px; height:42px; border-radius:5px; background:#111; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; position:relative;
  }
  .vitem img{max-width:100%; max-height:100%}
  .vitem.on{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
  .vitem.add{color:var(--dim); font-size:16px; border-style:dashed}
  .vitem .vname{position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.6); font-size:8px; text-align:center; color:#bbb; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .vitem .vdel{
    position:absolute; top:1px; right:1px; width:15px; height:15px; border-radius:50%;
    background:rgba(30,30,30,.9); border:1px solid #4a4a46; color:#c9c9c3; font-size:11px; line-height:13px;
    text-align:center; cursor:pointer; opacity:0; transition:opacity .12s; z-index:2;
  }
  .vitem:hover .vdel{opacity:1}
  .vitem .vdel:hover{background:#5a2323; border-color:#8c3a3a; color:#ffd7d7}

  .ease-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; padding:3px 10px}
  .ease-grid button{padding:5px 2px; font-size:10px}

  #curveBox{padding:4px 10px 8px}
  #curve{width:100%; height:118px; background:#111; border:1px solid var(--line); border-radius:6px; display:block; cursor:crosshair}

  .cards{display:grid; grid-template-columns:1fr 1fr; gap:5px; padding:5px 10px 10px}
  .card{
    background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    padding:8px 6px; text-align:center; cursor:pointer; font-size:11px; color:#cfcfca;
    transition:background .1s,border-color .1s;
  }
  .card:hover{background:#313131; border-color:#4a6a5e; color:#fff}
  .card .ico{display:block; font-size:14px; margin-bottom:3px; opacity:.85}

  footer{background:var(--panel); border-top:1px solid var(--line); display:flex; flex-direction:column; min-height:0; min-width:0}
  #tlbar{
    display:flex; align-items:center; gap:7px; padding:0 10px; height:36px;
    border-bottom:1px solid var(--line); flex:none; overflow-x:auto; overflow-y:hidden; min-width:0;
  }
  #tlbar::-webkit-scrollbar{height:0}
  #tlbar .t{font-variant-numeric:tabular-nums; color:#cfcfca; font-size:11px; min-width:96px}
  #tlbar .t em{font-style:normal; color:var(--dim)}
  #tlwrap{flex:1; position:relative; min-height:0; min-width:0}
  #tl{display:block; width:100%; height:100%; cursor:default}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Rigframe<em>原型 v0.2</em></div>
    <div class="vline"></div>
    <button id="btnUndo" title="撤销 (Ctrl+Z)">↶ 撤销</button>
    <button id="btnRedo" title="重做 (Ctrl+Shift+Z)">↷ 重做</button>
    <div class="spacer"></div>
    <button id="btnHelp" title="打开使用说明" style="padding:5px 9px">?</button>
    <button id="btnImport">导入分层图</button>
    <button id="btnAudio">导入音乐</button>
    <button id="btnExport" class="primary">导出视频</button>
    <button id="btnLoad">导入工程</button>
    <button id="btnSave">导出工程</button>
  </header>

  <main>
    <aside id="layers">
      <div id="layerTabs">
        <div class="ltab on" data-ltab="flat">图层</div>
        <div class="ltab" data-ltab="tree">父子级</div>
        <span class="cnt" id="layerCount"></span>
      </div>
      <div class="panel-body" id="layerList"></div>
      <div class="panel-foot">
        <button id="btnAddTex" style="flex:1">＋ 贴图</button>
        <button id="btnDelPart" style="flex:1">删除</button>
      </div>
    </aside>

    <section id="stage">
      <canvas id="view"></canvas>
      <div id="drop">
        <b>把分层 PNG 拖进来</b>
        <div>每个部件一张图，同一部位的不同贴图用 __ 区分<br>建议所有图层按整画布尺寸导出，软件会自动对齐</div>
        <button id="btnDemo">载入示例角色</button>
      </div>
      <div id="hint">拖拽移动 · 拖四角圆点缩放 · 拖右下圆钮旋转 · 滚轮缩放视图 · 中键平移 · 右键菜单<br>空格播放 · T 打拍子 · Shift 多选 · 空白处拖拽框选 · Ctrl+C/V 复制粘贴</div>
      <div id="toast"></div>
    </section>

    <aside id="inspector">
      <div class="tabs">
        <div class="tab on" data-tab="props">属性</div>
        <div class="tab" data-tab="curve">曲线</div>
        <div class="tab" data-tab="action">动作</div>
        <div class="tab" data-tab="scene">场景</div>
      </div>
      <div class="panel-body" id="inspBody"></div>
    </aside>
  </main>

  <footer>
    <div id="tlbar">
      <button id="btnPlay">▶</button>
      <div class="t" id="timeLabel">0.00s <em>/ 8.00s</em></div>
      <div class="vline"></div>
      <span style="color:var(--dim);font-size:10.5px">BPM</span>
      <input id="bpm" type="number" value="120" min="40" max="240" style="width:52px">
      <span style="color:var(--dim);font-size:10.5px">拍号</span>
      <input id="sig" type="number" value="4" min="2" max="12" style="width:40px">
      <button id="btnSnap" class="on" title="吸附到 1/4 拍">吸附 1/4</button>
      <div class="vline"></div>
      <button id="btnRec" class="on" title="自动记录：改属性时在播放头落关键帧（全局）">● 自动记录</button>
      <button id="btnKeyFrame" title="在播放头处给当前图层手动加一个关键帧">＋ 关键帧</button>
      <div class="vline"></div>
      <button id="btnCue" title="在播放头处添加卡点">＋ 卡点</button>
      <button id="btnTexEvent" title="在播放头处插入贴图切换">＋ 贴图事件</button>
      <button id="btnMakeComp3" title="把选中关键帧存为组件">＋ 存为组件</button>
      <select id="quickAction" title="在播放头处插入动作组件" style="width:104px"></select>
      <div class="vline"></div>
      <button id="zoomOut" title="缩小（Ctrl+滚轮）">－</button>
      <span id="zoomLabel" style="color:var(--muted);font-size:10.5px;min-width:36px;text-align:center">100%</span>
      <button id="zoomIn" title="放大（Ctrl+滚轮）">＋</button>
      <button id="zoomFit" title="适应窗口">适应</button>
      <div class="spacer"></div>
      <span style="color:var(--dim);font-size:10.5px" id="cueCount"></span>
    </div>
    <div id="prbar">
      <button id="btnMidi" title="导入 MIDI 文件（.mid）">导入 MIDI</button>
      <span class="lbl" id="midiName">无 MIDI</span>
      <div class="vline"></div>
      <span class="lbl">口型图层</span>
      <select id="lipPart" style="width:98px" title="把音符映射到这个图层的贴图上"></select>
      <span class="lbl">通道</span>
      <select id="lipCh" style="width:72px" title="只用这个通道的音符做口型"></select>
      <span class="lbl">静音贴图</span>
      <select id="lipDef" style="width:74px" title="音符之间（闭嘴）用哪张贴图"></select>
      <button id="btnLipAuto" title="按音高从低到高把贴图依次分配">自动映射</button>
      <button id="btnLipBake" title="把音符烘焙成该图层的贴图关键帧">生成口型</button>
      <button id="btnLipClear" title="删除所有口型关键帧">清除</button>
      <div class="spacer"></div>
      <button id="btnPrToggle" title="展开 / 收起钢琴窗">钢琴窗 ▲</button>
    </div>
    <div id="prwrap"><canvas id="pr"></canvas></div>
    <div id="tlwrap"><canvas id="tl"></canvas></div>
  </footer>
</div>

<div id="ctxMenu"></div>
<div id="modal"><div class="mbox">
  <h3 id="modalTitle">命名</h3>
  <input id="modalInput" type="text">
  <div class="mfoot"><button id="modalCancel">取消</button><button id="modalOk" class="primary">确定</button></div>
</div></div>
<div id="expModal"><div class="mbox">
  <h3>导出视频</h3>
  <div class="erow"><label>帧率</label><select id="expFps">
    <option value="24">24 fps</option><option value="30" selected>30 fps</option><option value="60">60 fps</option>
  </select></div>
  <div class="erow"><label>尺寸</label><select id="expScale">
    <option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option>
  </select><span class="ev" id="expPx" style="flex:none;text-align:right;min-width:84px"></span></div>
  <div class="erow"><label>范围</label><input id="expStart" type="number" step="0.1" min="0" style="width:66px"><span style="color:var(--dim)">→</span><input id="expEnd" type="number" step="0.1" min="0" style="width:66px"><span style="color:var(--dim);font-size:10.5px">秒</span></div>
  <div class="erow"><label>时长</label><span class="ev" id="expDur"></span></div>
  <div class="erow"><label>音频</label><span class="ev" id="expAud"></span></div>
  <div class="ebar"><i id="expBar"></i></div>
  <div class="estat" id="expStatus">准备就绪</div>
  <div class="mfoot"><button id="expCancel">取消</button><button id="expOk" class="primary">开始导出</button></div>
</div></div>
<div id="dropZone"><b>松开即可导入</b><small>图片 → 作为图层　音频 → 作为音乐　MIDI → 钢琴窗</small></div>

<input id="filePick" type="file" accept="image/*" multiple hidden>
<input id="projPick" type="file" accept=".json,application/json" hidden>
<input id="texPick" type="file" accept="image/*" multiple hidden>
<input id="audioPick" type="file" accept="audio/*" hidden>
<input id="bgPick" type="file" accept="image/*" hidden>
<input id="midiPick" type="file" accept=".mid,.midi,audio/midi,audio/x-midi" hidden>

<script>
"use strict";

/* ============================ 状态 ============================ */
const S = {
  doc: { w: 1000, h: 1000 },
  bg: { type: "color", color: "#14141a", c1: "#1d3346", c2: "#3a1f2e", angle: 135, img: null },
  bpm: 120, sig: 4, beat: 0, snap: true,
  parts: [], cues: [], clips: [], selected: null,
  selKeys: [], selClips: [], selKey: null, selectedClip: null, marquee: null,
  view: { scale: 1, ox: 0, oy: 0 },
  playing: false, audio: null, audioDur: 0, audioName: "", audioOffset: 0,
  pivotMode: false, tab: "props", selKey: null, record: true, expanded: {}, linkScale: true, scaleOnResize: true,
  layerTab: "flat",
  midi: null, prOpen: false, prScroll: 0,
  lip: { partId: null, ch: -1, map: {}, def: 0 },
  zoom: 1, scrollBeat: 0, scrollRow: 0, visibleBeats: 16, maxScrollBeat: 0, maxRowScroll: 0
};

let uid = 0;
const nid = () => "p" + (++uid);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const view = document.getElementById("view");
const ctx = view.getContext("2d");
const tl = document.getElementById("tl");
const tctx = tl.getContext("2d");

/* ============================ 撤销 ============================ */
let undoStack = [], redoStack = [], pending = null;

function cloneState(){
  return {
    doc: { ...S.doc }, bg: { ...S.bg }, bpm: S.bpm, sig: S.sig,
    cues: S.cues.slice(),
    clips: S.clips.map(c => ({ ...c, base: { ...c.base } })),
    parts: S.parts.map(p => ({
      ...p,
      bend: p.bend ? p.bend.slice() : null,
      mesh: p.mesh ? { ...p.mesh } : null,
      spring: p.spring ? { ...p.spring } : null,
      variants: p.variants.map(v => ({ ...v })),
      keys: p.keys.map(k => ({
        ...k,
        bend: k.bend ? k.bend.slice() : undefined,
        ease: k.ease ? { ...k.ease, p: k.ease.p ? k.ease.p.slice() : null } : null
      }))
    })),
    midi: S.midi ? { ...S.midi, notes: S.midi.notes.map(n => ({ ...n })), pitches: S.midi.pitches.slice(), chans: S.midi.chans.slice() } : null,
    lip: { partId: S.lip.partId, ch: S.lip.ch, def: S.lip.def, map: { ...S.lip.map } },
    selId: S.selected ? S.selected.id : null
  };
}
function pushUndo(){
  undoStack.push(cloneState());
  if (undoStack.length > 80) undoStack.shift();
  redoStack.length = 0;
  syncUndoBtns();
}
function beginEdit(){ if (!pending) pending = cloneState(); }
function endEdit(){
  if (pending){ undoStack.push(pending); if (undoStack.length > 80) undoStack.shift(); redoStack.length = 0; pending = null; syncUndoBtns(); }
}
function restore(st){
  S.doc = { ...st.doc }; S.bg = { ...st.bg }; S.bpm = st.bpm; S.sig = st.sig;
  S.cues = st.cues.slice();
  S.clips = (st.clips || []).map(c => ({ ...c, base: { ...c.base } }));
  S.parts = st.parts.map(p => ({
    ...p,
    variants: p.variants.map(v => ({ ...v })),
    keys: p.keys.map(k => ({ ...k, ease: k.ease ? { ...k.ease, p: k.ease.p ? k.ease.p.slice() : null } : null }))
  }));
  S.selected = st.selId ? S.parts.find(p => p.id === st.selId) || null : null;
  S.midi = st.midi ? { ...st.midi, notes: st.midi.notes.map(n => ({ ...n })), pitches: st.midi.pitches.slice(), chans: st.midi.chans.slice() } : null;
  if (st.lip) S.lip = { partId: st.lip.partId, ch: st.lip.ch, def: st.lip.def, map: { ...st.lip.map } };
  clearSel();
  applyAt(S.beat);
  renderAll();
}

/* ---------- 选择集合 ---------- */
function clearSel(){
  S.selKeys = []; S.selClips = [];
  S.selKey = null; S.selectedClip = null;
}
function setSelKey(partId, key){
  S.selKey = key ? { partId, t: key.t, key } : null;
}
function selKeyToggle(partId, key, additive){
  if (!additive){ S.selKeys = []; S.selClips = []; S.selectedClip = null; }
  const i = S.selKeys.findIndex(s => s.key === key);
  if (additive && i >= 0) S.selKeys.splice(i, 1);
  else if (i < 0) S.selKeys.push({ partId, key });
  const last = S.selKeys[S.selKeys.length - 1];
  setSelKey(last ? last.partId : null, last ? last.key : null);
}
function selClipToggle(clip, additive){
  if (!additive){ S.selClips = []; S.selKeys = []; S.selKey = null; }
  const i = S.selClips.indexOf(clip);
  if (additive && i >= 0) S.selClips.splice(i, 1);
  else if (i < 0) S.selClips.push(clip);
  S.selectedClip = S.selClips[0] || null;
}
function hasSel(){ return S.selKeys.length > 0 || S.selClips.length > 0; }
function undo(){ if (!undoStack.length) return; redoStack.push(cloneState()); restore(undoStack.pop()); syncUndoBtns(); }
function redo(){ if (!redoStack.length) return; undoStack.push(cloneState()); restore(redoStack.pop()); syncUndoBtns(); }
function syncUndoBtns(){
  document.getElementById("btnUndo").disabled = !undoStack.length;
  document.getElementById("btnRedo").disabled = !redoStack.length;
}

/* ============================ 缓动曲线 ============================ */
const EASE_PRESETS = [
  { name: "线性",   p: [0, 0, 1, 1] },
  { name: "缓入",   p: [0.42, 0, 1, 1] },
  { name: "缓出",   p: [0, 0, 0.58, 1] },
  { name: "缓入缓出", p: [0.42, 0, 0.58, 1] },
  { name: "强缓出", p: [0, 0, 0.2, 1] },
  { name: "回弹",   p: [0.34, 1.56, 0.64, 1] },
  { name: "蓄力",   p: [0.68, -0.55, 0.27, 1.55] },
  { name: "阶跃",   p: null },
  { name: "缓入强出", p: [0.7, 0, 0.2, 1] }
];
const DEF_EASE = { p: [0.42, 0, 0.58, 1] };

function bezierY(x, p){
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  const [x1, y1, x2, y2] = p;
  let t = x;
  for (let i = 0; i < 8; i++){
    const mt = 1 - t;
    const bx = 3*mt*mt*t*x1 + 3*mt*t*t*x2 + t*t*t;
    const dx = 3*mt*mt*x1 + 6*mt*t*(x2 - x1) + 3*t*t*(1 - x2);
    if (Math.abs(dx) < 1e-6) break;
    t -= (bx - x) / dx;
    t = clamp(t, 0, 1);
  }
  const mt = 1 - t;
  return 3*mt*mt*t*y1 + 3*mt*t*t*y2 + t*t*t;
}
function easeVal(ease, x){
  if (!ease || !ease.p) return x < 1 ? 0 : 1;
  return bezierY(x, ease.p);
}

/* ============================ 矩阵 ============================ */
function mul(m, n){
  return {
    a: m.a*n.a + m.c*n.b, b: m.b*n.a + m.d*n.b,
    c: m.a*n.c + m.c*n.d, d: m.b*n.c + m.d*n.d,
    e: m.a*n.e + m.c*n.f + m.e, f: m.b*n.e + m.d*n.f + m.f
  };
}
function localMatrix(p){
  const c = Math.cos(p.rot), s = Math.sin(p.rot);
  const fx = p.flipX ? -1 : 1, fy = p.flipY ? -1 : 1;
  return { a:c*p.sx*fx, b:s*p.sx*fx, c:-s*p.sy*fy, d:c*p.sy*fy, e:p.x, f:p.y };
}
function rootMatrix(){ const v = S.view; return { a:v.scale, b:0, c:0, d:v.scale, e:v.ox, f:v.oy }; }
function worldOf(p, seen){
  seen = seen || new Set();
  if (seen.has(p.id)) return rootMatrix();
  seen.add(p.id);
  const par = p.parentId ? S.parts.find(q => q.id === p.parentId) : null;
  const pm = par ? worldOf(par, seen) : rootMatrix();
  return mul(pm, localMatrix(p));
}
function invLinear(m, dx, dy){
  const det = m.a*m.d - m.b*m.c || 1e-6;
  return { x:( m.d*dx - m.c*dy)/det, y:(-m.b*dx + m.a*dy)/det };
}

/* ============================ 图片工具 ============================ */
function readDataURL(f){ return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); }); }
function loadSrc(src){ return new Promise(r => { const im = new Image(); im.onload = () => r(im); im.src = src; }); }

const ALPHA = new WeakMap();          // img -> { w, h, a:Uint8Array }，用于透明区域点击穿透
function alphaBBox(img){
  const maxSide = 420;
  const k = Math.min(1, maxSide / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(img, 0, 0, w, h);
  let data;
  try { data = g.getImageData(0, 0, w, h).data; } catch(e){ return { x:0, y:0, w:img.width, h:img.height }; }
  const a = new Uint8Array(w * h);
  for (let i = 0, n = w * h; i < n; i++) a[i] = data[i * 4 + 3];
  ALPHA.set(img, { w, h, a });
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    if (a[y * w + x] > 8){
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  if (x1 < 0) return { x:0, y:0, w:img.width, h:img.height };
  return { x:x0/k, y:y0/k, w:(x1-x0+1)/k, h:(y1-y0+1)/k };
}
/* 取图像某点的 alpha（u/v 为图像像素坐标）。没有缓存时现场采样一次。 */
function alphaMapOf(img){
  let m = ALPHA.get(img);
  if (m) return m;
  if (!img || !img.width) return null;
  try {
    const maxSide = 300;
    const k = Math.min(1, maxSide / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d", { willReadFrequently: true });
    g.drawImage(img, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h).data;
    const a = new Uint8Array(w * h);
    for (let i = 0, n = w * h; i < n; i++) a[i] = d[i * 4 + 3];
    m = { w, h, a };
    ALPHA.set(img, m);
    return m;
  } catch(e){ return null; }
}
function makeThumb(img, bb){
  const size = 44;
  const c = document.createElement("canvas"); c.width = size; c.height = size;
  const g = c.getContext("2d");
  const k = Math.min(size / bb.w, size / bb.h);
  const w = bb.w * k, h = bb.h * k;
  g.drawImage(img, bb.x, bb.y, bb.w, bb.h, (size-w)/2, (size-h)/2, w, h);
  return c.toDataURL();
}

/* ============================ 部件识别 ============================ */
const SIDE_L = /_l\b|left|左/;
const SIDE_R = /_r\b|right|右/;
function classify(slot){
  const s = slot.toLowerCase();
  if (/head|头|face|脸|面|hair|发|eye|眼|mouth|嘴|brow|眉/.test(s)) return "head";
  if (/arm|手|臂/.test(s)) return SIDE_L.test(s) ? "arm_l" : "arm_r";
  if (/leg|腿|脚|foot/.test(s)) return SIDE_L.test(s) ? "leg_l" : "leg_r";
  return "body";
}
const KIND_ORDER = { body:0, leg_l:1, leg_r:2, arm_l:3, arm_r:4, head:5 };

function makePart(it){
  const bbox = alphaBBox(it.img);
  const cx = bbox.x + bbox.w/2, cy = bbox.y + bbox.h/2;
  return {
    id: nid(), slot: it.slot, kind: classify(it.slot),
    variants: [{ variant: it.variant, img: it.img, bbox, ax: cx, ay: cy, thumb: makeThumb(it.img, bbox) }],
    texIndex: 0, x: cx, y: cy, rot: 0, sx: 1, sy: 1, alpha: 1,
    flipX: false, flipY: false,
    ax: cx, ay: cy, pu: 0.5, pv: 0.5, parentId: null, keys: [], visible: true, locked: false, bbox
  };
}

function applyPivot(p){
  const u = p.pu === undefined ? 0.5 : p.pu;
  const v = p.pv === undefined ? 0.5 : p.pv;
  for (const it of p.variants){
    const bb = it.bbox;
    it.ax = bb.x + u * bb.w;
    it.ay = bb.y + v * bb.h;
  }
  const cur = p.variants[p.texIndex] || p.variants[0];
  if (cur){ p.ax = cur.ax; p.ay = cur.ay; }
}

async function addItems(items){
  if (!items.length) return;
  pushUndo();
  const imgs = [];
  for (const it of items) imgs.push(Object.assign({}, it, { img: await loadSrc(it.src) }));

  if (!S.parts.length && imgs[0].img.width){
    S.doc = { w: imgs[0].img.width, h: imgs[0].img.height };
  }

  for (const it of imgs){
    let p = S.parts.find(q => q.slot === it.slot);
    if (!p){
      p = makePart(it);
      S.parts.push(p);
    } else {
      const bbox = alphaBBox(it.img);
      p.variants.push({
        variant: it.variant, img: it.img, bbox,
        ax: bbox.x + bbox.w/2, ay: bbox.y + bbox.h/2,
        thumb: makeThumb(it.img, bbox)
      });
      applyPivot(p);
    }
  }

  S.parts.sort((a, b) => (KIND_ORDER[a.kind] ?? 9) - (KIND_ORDER[b.kind] ?? 9));
  for (const p of S.parts){
    if (p.parentId) continue;
    if (p.kind === "body") continue;
    const body = S.parts.find(q => q.kind === "body");
    if (body && body.id !== p.id){
      p.parentId = body.id;
      p.x = p.variants[0].ax - body.variants[0].ax;
      p.y = p.variants[0].ay - body.variants[0].ay;
    }
  }

  fitView();
  document.getElementById("drop").style.display = "none";
  if (!S.selected) S.selected = S.parts[0];
  renderAll();
  toast("已导入 " + imgs.length + " 张图层");
}

async function addFiles(files){
  const items = [];
  for (const f of files){
    if (!isImageFile(f)) continue;
    const base = f.name.replace(/\.[^.]+$/, "");
    const bits = base.split("__");
    items.push({ slot: (bits[0] || base).trim(), variant: (bits[1] || "").trim(), src: await readDataURL(f) });
  }
  await addItems(items);
}

async function addTexture(files){
  const p = S.selected;
  if (!p){ toast("先选中一个图层"); return; }
  const items = [];
  for (const f of files){
    if (!isImageFile(f)) continue;
    const base = f.name.replace(/\.[^.]+$/, "");
    const bits = base.split("__");
    items.push({ slot: p.slot, variant: (bits[1] || base).trim(), src: await readDataURL(f) });
  }
  if (!items.length) return;
  pushUndo();
  for (const it of items){
    const img = await loadSrc(it.src);
    const bbox = alphaBBox(img);
    p.variants.push({
      variant: it.variant, img, bbox,
      ax: bbox.x + bbox.w/2, ay: bbox.y + bbox.h/2,
      thumb: makeThumb(img, bbox)
    });
  }
  applyPivot(p);
  renderAll();
  toast("已添加 " + items.length + " 张贴图到「" + p.slot + "」");
}

/* ============================ 视图 ============================ */
function fitView(){
  const W = view.clientWidth || 800, H = view.clientHeight || 600;
  const s = Math.min(W / S.doc.w, H / S.doc.h) * 0.88;
  S.view.scale = s;
  S.view.ox = (W - S.doc.w * s) / 2;
  S.view.oy = (H - S.doc.h * s) / 2;
}

/* ============================ 关键帧 ============================ */
function keySnapshot(p, beat, patch){
  const k = { t: beat, x:p.x, y:p.y, rot:p.rot, sx:p.sx, sy:p.sy, alpha:p.alpha, tex:p.texIndex,
              flipX: !!p.flipX, flipY: !!p.flipY,
              ease: { p: [0.42, 0, 0.58, 1] } };
  if (p.bend && p.bend.length) k.bend = p.bend.slice();
  if (patch) Object.assign(k, patch);
  return k;
}
function upsertKey(p, beat, patch){
  const snap = keySnapshot(p, beat, patch);
  const ex = p.keys.find(k => Math.abs(k.t - beat) < 1e-3);
  if (ex){
    const keepEase = ex.ease;
    Object.assign(ex, snap);
    if (!patch || !patch.ease) ex.ease = keepEase;
  } else {
    p.keys.push(snap);
    p.keys.sort((a, b) => a.t - b.t);
  }
  applyAt(S.beat);
}
function touchForce(p){
  const snap = keySnapshot(p, S.beat);
  const ex = p.keys.find(k => Math.abs(k.t - S.beat) < 1e-3);
  if (ex){ const keepEase = ex.ease; Object.assign(ex, snap); ex.ease = keepEase; }
  else { p.keys.push(snap); p.keys.sort((a, b) => a.t - b.t); }
}
function touch(p){
  const selThis = S.selKey && S.selKey.partId === p.id;
  if (!S.record && !selThis) return;
  touchForce(p);
}

function clipValueAt(clip, beat){
  const a = ACTION_LIB.find(x => x.id === clip.actionId);
  if (!a || !a.keys.length) return null;
  const ks = a.keys;
  const span = ks[ks.length - 1].t || 0.25;
  const k = (beat - clip.start) / Math.max(0.001, clip.dur);
  if (k < -0.001 || k > 1.001) return null;
  const tt = clamp(k, 0, 1) * span;

  let i0 = 0;
  for (let i = 0; i < ks.length - 1; i++){
    if (ks[i].t <= tt && tt <= ks[i + 1].t){ i0 = i; break; }
    i0 = i;
  }
  const A = ks[i0], B = ks[Math.min(i0 + 1, ks.length - 1)];
  const seg = B.t - A.t;
  const raw = seg > 1e-6 ? (tt - A.t) / seg : 0;
  const e = A.ease !== undefined ? A.ease : { p: [0.42, 0, 0.58, 1] };
  const t = easeVal(e, clamp(raw, 0, 1));

  const get = (key, dflt) => {
    const av = A[key] !== undefined ? A[key] : dflt;
    const bv = B[key] !== undefined ? B[key] : av;
    return av + (bv - av) * t;
  };
  const base = clip.base;
  const rel = !!a.rel;
  const hasSx = A.sx !== undefined || B.sx !== undefined;
  const hasSy = A.sy !== undefined || B.sy !== undefined;
  const hasAl = A.alpha !== undefined || B.alpha !== undefined;
  const sxf = hasSx ? get("sx", 1) : 1;
  const syf = hasSy ? get("sy", 1) : 1;
  const alf = hasAl ? get("alpha", 1) : 1;

  return {
    x: base.x + (A.x !== undefined || B.x !== undefined ? get("x", 0) : 0),
    y: base.y + (A.y !== undefined || B.y !== undefined ? get("y", 0) : 0),
    rot: base.rot + (A.rot !== undefined || B.rot !== undefined ? get("rot", 0) : 0),
    sx: hasSx ? (rel ? base.sx * sxf : sxf) : base.sx,
    sy: hasSy ? (rel ? base.sy * syf : syf) : base.sy,
    alpha: hasAl ? (rel ? base.alpha * alf : alf) : base.alpha,
    tex: (t < 0.5 ? (A.tex !== undefined ? A.tex : base.tex) : (B.tex !== undefined ? B.tex : base.tex))
  };
}

function activeClipFor(p, beat){
  return S.clips.find(c => c.partId === p.id && beat >= c.start - 1e-6 && beat <= c.start + c.dur + 1e-6) || null;
}

function applyFlip(p, beat, clip){
  if (clip){                       // 片段覆盖时，镜像归片段管
    p.flipX = !!clip.flipX;
    p.flipY = !!clip.flipY;
    return;
  }
  if (!p.keys.length) return;
  const ks = p.keys;
  let a = ks[0];
  for (let i = 0; i < ks.length; i++){
    if (ks[i].t <= beat + 1e-6) a = ks[i];
    else break;
  }
  p.flipX = !!a.flipX;
  p.flipY = !!a.flipY;
}

function applyAt(beat){
  for (const p of S.parts){
    const clip = activeClipFor(p, beat);
    applyFlip(p, beat, clip);
    if (clip){
      const v = clipValueAt(clip, beat);
      if (v){
        p.x = v.x; p.y = v.y; p.rot = v.rot;
        p.sx = v.sx; p.sy = v.sy; p.alpha = v.alpha;
        p.texIndex = clamp(Math.round(v.tex), 0, p.variants.length - 1);
        continue;
      }
    }
    if (!p.keys.length) continue;
    const ks = p.keys;
    let a = ks[0], b = ks[ks.length - 1];
    if (beat <= a.t) b = a;
    else if (beat >= b.t) a = b;
    else for (let i = 0; i < ks.length - 1; i++){
      if (ks[i].t <= beat && beat <= ks[i + 1].t){ a = ks[i]; b = ks[i + 1]; break; }
    }
    const span = b.t - a.t;
    const raw = span > 1e-6 ? (beat - a.t) / span : 0;
    const t = easeVal(a.ease, clamp(raw, 0, 1));
    p.x = a.x + (b.x - a.x) * t;
    p.y = a.y + (b.y - a.y) * t;
    p.rot = a.rot + (b.rot - a.rot) * t;
    p.sx = a.sx + (b.sx - a.sx) * t;
    p.sy = a.sy + (b.sy - a.sy) * t;
    p.alpha = a.alpha + (b.alpha - a.alpha) * t;
    p.texIndex = clamp(t < 0.5 ? a.tex : b.tex, 0, p.variants.length - 1);
    if (p.bend && p.bend.length){
      const A = a.bend || [], B = b.bend || [];
      for (let i = 0; i < p.bend.length; i++){
        const av = A[i] || 0, bv = B[i] === undefined ? av : B[i];
        p.bend[i] = av + (bv - av) * t;
      }
    }
  }
}

/* ============================ 绘制 ============================ */
function drawBackground(gc, forExport){
  gc = gc || ctx;
  const v = S.view, d = S.doc;
  const x = v.ox, y = v.oy, w = d.w * v.scale, h = d.h * v.scale;
  const bg = S.bg;
  if (bg.type === "color"){
    gc.fillStyle = bg.color;
    gc.fillRect(x, y, w, h);
  } else if (bg.type === "gradient"){
    const rad = (bg.angle - 90) * Math.PI / 180;
    const cx = x + w/2, cy = y + h/2;
    const len = (Math.abs(w * Math.cos(rad)) + Math.abs(h * Math.sin(rad))) / 2;
    const gr = gc.createLinearGradient(cx - Math.cos(rad)*len, cy - Math.sin(rad)*len,
                                       cx + Math.cos(rad)*len, cy + Math.sin(rad)*len);
    gr.addColorStop(0, bg.c1); gr.addColorStop(1, bg.c2);
    gc.fillStyle = gr;
    gc.fillRect(x, y, w, h);
  } else if (bg.type === "image" && bg.img){
    const iw = bg.img.width, ih = bg.img.height;
    const k = Math.max(w / iw, h / ih);
    gc.save();
    gc.beginPath(); gc.rect(x, y, w, h); gc.clip();
    gc.drawImage(bg.img, cx0(x, w, iw, k), cx0(y, h, ih, k), iw*k, ih*k);
    gc.restore();
  } else if (forExport){
    gc.fillStyle = "#000";
    gc.fillRect(x, y, w, h);
  } else {
    const cell = 10;
    for (let i = 0; i * cell < w; i++) for (let j = 0; j * cell < h; j++){
      gc.fillStyle = ((i + j) % 2) ? "#1a1a1a" : "#202020";
      gc.fillRect(x + i*cell, y + j*cell, Math.min(cell, w - i*cell), Math.min(cell, h - j*cell));
    }
  }
}
function cx0(origin, span, nat, k){ return origin + (span - nat*k) / 2; }

/* ---------- 网格变形绘制 ---------- */
function drawBent(g, p, it){
  const bb = it.bbox, n = p.bend.length;
  if (n < 1) return;
  const segH = bb.h / n;
  const x0 = bb.x + bb.w/2 - it.ax;
  const y0 = bb.y - it.ay;
  const ov = Math.min(segH * 0.6, 3);     // 关节重叠，盖住楔形缝
  const top = bb.y, bottom = bb.y + bb.h;

  // 先算出每个关节的位置和累计角度（局部坐标，原点在链起点）
  const jx = new Float64Array(n + 1), jy = new Float64Array(n + 1), acc = new Float64Array(n + 1);
  let a = 0;
  for (let k = 0; k < n; k++){
    a += p.bend[k] || 0;
    acc[k + 1] = a;
    jx[k + 1] = jx[k] - Math.sin(a) * segH;
    jy[k + 1] = jy[k] + Math.cos(a) * segH;
  }

  g.save();
  g.translate(x0, y0);
  for (let k = 0; k < n; k++){
    const segTop = bb.y + k * segH;
    const sy0 = Math.max(top, segTop - ov);
    const sy1 = Math.min(bottom, segTop + segH + ov);
    const sh = sy1 - sy0;
    if (sh <= 0.4) continue;

    // 用「上一段角度 + 本段角度」的平均值来画，并把切片居中在段中点：
    // 关节两侧各差一半，接缝的台阶减半，明显更顺
    const mid = (acc[k] + acc[k + 1]) / 2;
    const cx = (jx[k] + jx[k + 1]) / 2;
    const cy = (jy[k] + jy[k + 1]) / 2;

    g.save();
    g.translate(cx, cy);
    g.rotate(mid);
    g.drawImage(it.img, bb.x, sy0, bb.w, sh, -bb.w/2, (sy0 - segTop) - segH/2, bb.w, sh);
    g.restore();
  }
  g.restore();
}

function paintPart(g, p, it, m){
  g.save();
  g.transform(m.a, m.b, m.c, m.d, m.e, m.f);
  g.globalAlpha = clamp(p.alpha, 0, 1);
  if (p.mesh && p.mesh.on && p.bend && p.bend.length) drawBent(g, p, it);
  else g.drawImage(it.img, -it.ax, -it.ay);
  g.restore();
}

function draw(){
  const dpr = window.devicePixelRatio || 1;
  const W = view.clientWidth, H = view.clientHeight;
  if (view.width !== Math.round(W*dpr) || view.height !== Math.round(H*dpr)){
    view.width = Math.round(W*dpr); view.height = Math.round(H*dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#0d0d0d";
  ctx.fillRect(0, 0, W, H);

  const v = S.view, d = S.doc;
  const fx = v.ox, fy = v.oy, fw = d.w * v.scale, fh = d.h * v.scale;

  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = 18;
  ctx.fillStyle = "#000";
  ctx.fillRect(fx, fy, fw, fh);
  ctx.restore();

  ctx.save();
  ctx.beginPath(); ctx.rect(fx, fy, fw, fh); ctx.clip();
  drawBackground();

  for (const p of S.parts){
    if (!p.visible) continue;
    const it = p.variants[p.texIndex] || p.variants[0];
    if (!it) continue;
    paintPart(ctx, p, it, worldOf(p));
  }
  ctx.restore();

  ctx.strokeStyle = "#4a4a46";
  ctx.lineWidth = 1;
  ctx.strokeRect(fx + .5, fy + .5, fw - 1, fh - 1);

  if (S.selected && S.selected.visible) drawGizmo(S.selected);
}

/* ============================ 变换手柄 ============================ */
const GIZ = { btnR: 11, btnHit: 14, dotR: 5, dotHit: 11, gap: 13 };

function gizmoQuad(p){
  const it = p.variants[p.texIndex] || p.variants[0];
  if (!it) return null;
  const m = worldOf(p), bb = it.bbox;
  const L = [[bb.x - it.ax, bb.y - it.ay], [bb.x + bb.w - it.ax, bb.y - it.ay],
             [bb.x + bb.w - it.ax, bb.y + bb.h - it.ay], [bb.x - it.ax, bb.y + bb.h - it.ay]];
  const pts = L.map(([u, v]) => ({ x: m.a*u + m.c*v + m.e, y: m.b*u + m.d*v + m.f }));
  const cx = (pts[0].x + pts[1].x + pts[2].x + pts[3].x) / 4;
  const cy = (pts[0].y + pts[1].y + pts[2].y + pts[3].y) / 4;
  return { pts, cx, cy, m, it, L };
}

function gizmoButtons(g){
  const W = view.clientWidth || 900, H = view.clientHeight || 600;
  const put = (i, type) => {
    const c = g.pts[i];
    const a = g.pts[(i + 1) % 4], b = g.pts[(i + 3) % 4];
    const ux = c.x - a.x, uy = c.y - a.y, ul = Math.hypot(ux, uy) || 1;
    const vx = c.x - b.x, vy = c.y - b.y, vl = Math.hypot(vx, vy) || 1;
    let dx = ux/ul + vx/vl, dy = uy/ul + vy/vl;
    const dl = Math.hypot(dx, dy) || 1;
    dx /= dl; dy /= dl;
    const off = GIZ.btnR + GIZ.gap;
    return {
      type, i,
      x: clamp(c.x + dx*off, GIZ.btnR + 2, W - GIZ.btnR - 2),
      y: clamp(c.y + dy*off, GIZ.btnR + 2, H - GIZ.btnR - 2)
    };
  };
  return [put(0, "del"), put(3, "dup"), put(2, "rot")];
}

function drawGizmo(p){
  const g = gizmoQuad(p);
  if (!g) return;
  const { pts, m } = g;
  const locked = p.locked;

  ctx.save();
  ctx.strokeStyle = locked ? "rgba(136,135,128,.9)" : "rgba(255,255,255,.9)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < 4; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.stroke();

  if (!locked){
    for (const c of pts){
      ctx.beginPath(); ctx.arc(c.x, c.y, GIZ.dotR, 0, Math.PI*2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 1; ctx.stroke();
    }
  }

  ctx.fillStyle = locked ? "#888780" : "#5DCAA5";
  ctx.beginPath(); ctx.arc(m.e, m.f, 3.5, 0, Math.PI*2); ctx.fill();

  if (S.pivotMode){
    ctx.strokeStyle = "#F0997B";
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(m.e - 15, m.f); ctx.lineTo(m.e + 15, m.f); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(m.e, m.f - 15); ctx.lineTo(m.e, m.f + 15); ctx.stroke();
    ctx.beginPath(); ctx.arc(m.e, m.f, 9, 0, Math.PI*2); ctx.stroke();
  }

  if (!locked){
    for (const b of gizmoButtons(g)){
      ctx.beginPath(); ctx.arc(b.x, b.y, GIZ.btnR, 0, Math.PI*2);
      ctx.fillStyle = "rgba(255,255,255,.96)"; ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 1; ctx.stroke();

      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.strokeStyle = "#141414"; ctx.fillStyle = "#141414";
      if (b.type === "del"){
        ctx.lineWidth = 1.5; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(-3, -3); ctx.lineTo(3, 3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(3, -3); ctx.lineTo(-3, 3); ctx.stroke();
      } else if (b.type === "dup"){
        ctx.font = "bold 9px -apple-system,system-ui,sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("+1", 0, 0.5);
      } else {
        ctx.lineWidth = 1.3; ctx.lineCap = "round";
        ctx.beginPath(); ctx.arc(0, 0, 4, -Math.PI*0.72, Math.PI*0.62); ctx.stroke();
        const th = Math.PI*0.62;
        const ex = Math.cos(th)*4, ey = Math.sin(th)*4;
        const tx = -Math.sin(th), ty = Math.cos(th);
        const px = -ty, py = tx;
        ctx.beginPath();
        ctx.moveTo(ex + tx*2.6, ey + ty*2.6);
        ctx.lineTo(ex - tx*0.9 + px*2.1, ey - ty*0.9 + py*2.1);
        ctx.lineTo(ex - tx*0.9 - px*2.1, ey - ty*0.9 - py*2.1);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
  }

  if (gizmoDrag && gizmoDrag.type === "rot"){
    const deg = Math.round(p.rot*180/Math.PI);
    ctx.font = "bold 11px -apple-system,system-ui,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const label = deg + "°";
    const w = ctx.measureText(label).width + 12;
    ctx.fillStyle = "rgba(0,0,0,.75)";
    roundRect(ctx, m.e - w/2, m.f - 38, w, 19, 5); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillText(label, m.e, m.f - 28.5);
  }
  ctx.restore();
}

function hitGizmo(mx, my){
  if (!S.selected || !S.selected.visible || S.selected.locked) return null;
  const g = gizmoQuad(S.selected);
  if (!g) return null;
  for (const b of gizmoButtons(g)){
    if (Math.hypot(mx - b.x, my - b.y) <= GIZ.btnHit) return { type: b.type, i: b.i, g };
  }
  for (let i = 0; i < 4; i++){
    if (Math.hypot(mx - g.pts[i].x, my - g.pts[i].y) <= GIZ.dotHit) return { type: "scale", i, g };
  }
  return null;
}

function deletePart(p){
  const par = p.parentId ? S.parts.find(q => q.id === p.parentId) : null;
  for (const c of S.parts){
    if (c.parentId !== p.id) continue;
    const w = worldOf(c);
    c.parentId = par ? par.id : null;
    const pm = par ? worldOf(par) : rootMatrix();
    const d = invLinear(pm, w.e - pm.e, w.f - pm.f);
    c.x = d.x; c.y = d.y;
  }
  S.parts = S.parts.filter(q => q.id !== p.id);
  S.clips = S.clips.filter(c => c.partId !== p.id);
  S.selected = null; S.selectedClip = null; S.selKey = null;
  applyAt(S.beat); renderAll();
  toast("已删除「" + p.slot + "」，可撤销");
}

function duplicatePart(p){
  const variants = p.variants.map(v => ({ variant: v.variant, img: v.img, bbox: v.bbox, ax: v.ax, ay: v.ay, thumb: v.thumb }));
  const np = {
    id: nid(), slot: p.slot + " 副本", kind: p.kind, variants, texIndex: p.texIndex,
    x: p.x + 40, y: p.y + 40, rot: p.rot, sx: p.sx, sy: p.sy, alpha: p.alpha,
    ax: p.ax, ay: p.ay, pu: p.pu, pv: p.pv, parentId: p.parentId,
    keys: p.keys.map(k => ({ ...k })), visible: true, locked: false, bbox: p.bbox
  };
  S.parts.push(np);
  S.selected = np; S.selectedClip = null; S.selKey = null;
  renderAll();
  toast("已复制「" + p.slot + "」");
}

/* ============================ 时间轴 ============================ */
let totalBeats = 16, pxPerBeat = 60, labelW = 96, rulerH = 22, rowH = 18;
const tlRows = [];

const SB_H = 9;

function timelineLayout(){
  const W = tl.clientWidth || 800, H = tl.clientHeight || 150;
  const lastKey = S.parts.reduce((m, p) => p.keys.reduce((mm, k) => Math.max(mm, k.t), m), 0);
  const lastCue = S.cues.reduce((m, c) => Math.max(m, c), 0);
  const audioBeats = S.audio ? S.audioDur * S.bpm / 60 : 0;
  const clipEnd = S.clips.reduce((m, c) => Math.max(m, c.start + c.dur), 0);
  const midiBeats = S.midi ? (S.midi.durBeat || 0) : 0;
  totalBeats = Math.max(S.sig * 4, Math.ceil(Math.max(lastKey, lastCue, audioBeats, clipEnd, midiBeats, S.beat) + 2));

  labelW = 96;
  const availW = Math.max(60, W - labelW - 10);
  const fit = availW / totalBeats;
  pxPerBeat = fit * S.zoom;

  const visibleBeats = availW / pxPerBeat;
  S.visibleBeats = visibleBeats;
  const maxScroll = Math.max(0, totalBeats - visibleBeats);
  S.scrollBeat = clamp(S.scrollBeat, 0, maxScroll);
  S.maxScrollBeat = maxScroll;

  const list = S.parts.slice().reverse();
  const availH = Math.max(20, H - rulerH - 4 - SB_H);
  rowH = list.length ? clamp(availH / list.length, 16, 26) : 18;
  const contentH = list.length * rowH;
  const maxRowScroll = Math.max(0, contentH - availH);
  S.scrollRow = clamp(S.scrollRow, 0, maxRowScroll);
  S.maxRowScroll = maxRowScroll;
  S.availH = availH;

  tlRows.length = 0;
  list.forEach((p, i) => tlRows.push({ p, y: rulerH + i * rowH - S.scrollRow }));
  return { W, H, availW, contentH, maxRowScroll, availH };
}
const xOf = b => labelW + (b - S.scrollBeat) * pxPerBeat;
const beatOf = x => S.scrollBeat + (x - labelW) / pxPerBeat;

function zoomAt(newZoom, anchorX){
  const W = tl.clientWidth || 800;
  const availW = W - labelW - 10;
  const b = beatOf(anchorX);
  S.zoom = clamp(newZoom, 0.2, 40);
  pxPerBeat = (availW / totalBeats) * S.zoom;
  S.scrollBeat = Math.max(0, b - (anchorX - labelW) / pxPerBeat);
  drawTimeline();
  syncZoomLabel();
}
function setZoom(z){
  const W = tl.clientWidth || 800;
  zoomAt(z, labelW + (W - labelW) / 2);
}
function zoomFit(){
  S.zoom = 1; S.scrollBeat = 0; S.scrollRow = 0;
  drawTimeline(); syncZoomLabel();
}
function syncZoomLabel(){
  const el = document.getElementById("zoomLabel");
  if (el) el.textContent = Math.round(S.zoom * 100) + "%";
}

function roundRect(g, x, y, w, h, r){
  const rr = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  g.beginPath();
  g.moveTo(x + rr, y);
  g.lineTo(x + w - rr, y);
  g.quadraticCurveTo(x + w, y, x + w, y + rr);
  g.lineTo(x + w, y + h - rr);
  g.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  g.lineTo(x + rr, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - rr);
  g.lineTo(x, y + rr);
  g.quadraticCurveTo(x, y, x + rr, y);
  g.closePath();
}

function drawTimeline(){
  const dpr = window.devicePixelRatio || 1;
  const { W, H } = timelineLayout();
  if (tl.width !== Math.round(W*dpr) || tl.height !== Math.round(H*dpr)){
    tl.width = Math.round(W*dpr); tl.height = Math.round(H*dpr);
  }
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  tctx.clearRect(0, 0, W, H);
  tctx.fillStyle = "#191919"; tctx.fillRect(0, 0, W, H);
  tctx.fillStyle = "#1f1f1f"; tctx.fillRect(0, 0, W, rulerH);
  tctx.fillStyle = "#242424"; tctx.fillRect(0, 0, labelW, H);

  const contentH = H - SB_H;

  tctx.save();
  tctx.beginPath(); tctx.rect(labelW, 0, W - labelW, contentH); tctx.clip();

  const showSixteenth = pxPerBeat > 26;
  const b0 = Math.max(0, Math.floor(S.scrollBeat * 4) / 4 - 0.25);
  const b1 = Math.min(totalBeats, S.scrollBeat + S.visibleBeats + 1);
  for (let b = b0; b <= b1 + 1e-6; b += 0.25){
    const x = xOf(b);
    const isBar = Math.abs(b % S.sig) < 1e-6;
    const isBeat = Math.abs(b % 1) < 1e-6;
    if (!isBeat && !showSixteenth) continue;
    tctx.strokeStyle = isBar ? "#3f3f3f" : (isBeat ? "#2b2b2b" : "#232323");
    tctx.beginPath();
    tctx.moveTo(x, isBar ? 0 : rulerH - (isBeat ? 8 : 4));
    tctx.lineTo(x, contentH);
    tctx.stroke();
    if (isBar){
      tctx.fillStyle = "#8f8f89";
      tctx.font = "10px -apple-system,sans-serif";
      tctx.fillText(String(Math.round(b / S.sig) + 1), x + 3, 12);
    } else if (isBeat && pxPerBeat >= 30){
      tctx.fillStyle = "#6d6d67";
      tctx.font = "9px -apple-system,sans-serif";
      tctx.fillText(String(Math.round(b % S.sig) + 1), x + 3, 12);
    }
  }

  for (const c of S.cues){
    const x = xOf(c);
    if (x < labelW - 6 || x > W + 6) continue;
    tctx.fillStyle = "#F0997B";
    tctx.beginPath();
    tctx.moveTo(x, rulerH + 1); tctx.lineTo(x - 4, rulerH - 6); tctx.lineTo(x + 4, rulerH - 6);
    tctx.closePath(); tctx.fill();
  }

  tlRows.forEach(({ p, y }) => {
    if (y + rowH < rulerH || y > contentH) return;
    if (S.selected === p){
      tctx.fillStyle = "rgba(93,202,165,.07)";
      tctx.fillRect(labelW, y, W - labelW, rowH);
    }
    tctx.strokeStyle = "#242424";
    tctx.beginPath(); tctx.moveTo(labelW, y + rowH); tctx.lineTo(W, y + rowH); tctx.stroke();

    const cy = y + rowH/2;

    for (const c of S.clips.filter(c => c.partId === p.id)){
      const a = ACTION_LIB.find(x => x.id === c.actionId);
      const x1 = xOf(c.start), x2 = xOf(c.start + c.dur);
      if (x2 < labelW || x1 > W) continue;
      const bw = Math.max(8, x2 - x1);
      const bh = Math.min(rowH - 5, 18);
      const by = cy - bh/2;
      const sel = S.selClips.indexOf(c) >= 0;
      const cat = a ? a.cat : "基础";
      const fill = cat === "情绪" ? "#5d3a52" : cat === "卡点" ? "#54471f" : "#24503f";
      const edge = cat === "情绪" ? "#c78bb0" : cat === "卡点" ? "#c9a75a" : "#5DCAA5";
      tctx.save();
      tctx.fillStyle = fill;
      roundRect(tctx, x1, by, bw, bh, 3); tctx.fill();
      tctx.strokeStyle = sel ? "#ffffff" : edge;
      tctx.lineWidth = sel ? 1.5 : 0.8;
      roundRect(tctx, x1, by, bw, bh, 3); tctx.stroke();
      tctx.beginPath(); tctx.rect(x1 + 2, by, bw - 4, bh); tctx.clip();
      tctx.fillStyle = "#dcefe6";
      tctx.font = "9px -apple-system,sans-serif";
      tctx.fillText(a ? a.name : "", x1 + 5, cy + 3);
      tctx.restore();
      if (sel){
        tctx.fillStyle = "#ffffff";
        tctx.fillRect(x2 - 2.5, by + 2, 2, bh - 4);
      }
    }

    for (const k of p.keys){
      const x = xOf(k.t);
      if (x < labelW - 8 || x > W + 8) continue;
      const sel = S.selKeys.some(s => s.key === k);
      tctx.save();
      tctx.translate(x, cy);
      tctx.rotate(Math.PI/4);
      tctx.fillStyle = sel ? "#ffffff" : (S.selected === p ? "#5DCAA5" : "#4d7f6f");
      const sz = rowH > 15 ? 9 : 6;
      tctx.fillRect(-sz/2, -sz/2, sz, sz);
      tctx.restore();
    }
  });

  const px = xOf(S.beat);
  if (px >= labelW - 1 && px <= W + 1){
    tctx.strokeStyle = "#f0f0ea";
    tctx.lineWidth = 1;
    tctx.beginPath(); tctx.moveTo(px, 0); tctx.lineTo(px, contentH); tctx.stroke();
    tctx.fillStyle = "#f0f0ea";
    tctx.beginPath();
    tctx.moveTo(px - 5, 0); tctx.lineTo(px + 5, 0); tctx.lineTo(px, 8);
    tctx.closePath(); tctx.fill();
  }
  tctx.restore();

  tctx.save();
  tctx.beginPath(); tctx.rect(0, rulerH, labelW - 3, contentH - rulerH); tctx.clip();
  tlRows.forEach(({ p, y }) => {
    if (y + rowH < rulerH || y > contentH) return;
    tctx.fillStyle = S.selected === p ? "#dcdcd6" : (p.visible ? "#8d8d88" : "#4e4e4a");
    tctx.font = "10px -apple-system,sans-serif";
    tctx.fillText(p.slot, 10, y + rowH/2 + 3.5);
  });
  tctx.restore();

  if (S.marquee){
    const m = S.marquee;
    const x = Math.min(m.x1, m.x2), y = Math.min(m.y1, m.y2);
    const w = Math.abs(m.x2 - m.x1), h = Math.abs(m.y2 - m.y1);
    tctx.save();
    tctx.fillStyle = "rgba(93,202,165,.12)";
    tctx.strokeStyle = "rgba(93,202,165,.75)";
    tctx.lineWidth = 1;
    tctx.fillRect(x, y, w, h);
    tctx.strokeRect(x + .5, y + .5, w, h);
    tctx.restore();
  }

  const trackY = H - SB_H + 2, trackH = 5;
  const tx0 = labelW + 2, tx1 = W - 10;
  const trackW = Math.max(20, tx1 - tx0);
  const vis = Math.min(1, S.visibleBeats / totalBeats);
  const thumbW = Math.max(28, trackW * vis);
  const tpos = S.maxScrollBeat > 0 ? S.scrollBeat / S.maxScrollBeat : 0;
  const thumbX = tx0 + tpos * (trackW - thumbW);
  tctx.fillStyle = "rgba(255,255,255,.05)";
  roundRect(tctx, tx0, trackY, trackW, trackH, 3); tctx.fill();
  tctx.fillStyle = S.maxScrollBeat > 0.5 ? "#4d6b60" : "#333";
  roundRect(tctx, thumbX, trackY, thumbW, trackH, 3); tctx.fill();
  S.hsThumb = { x: thumbX, y: trackY, w: thumbW, h: trackH, tx0, trackW };

  if (S.maxRowScroll > 0.5){
    const vx = W - 6, vy0 = rulerH + 2, vy1 = contentH - 3;
    const span = Math.max(10, vy1 - vy0);
    const vh = Math.max(16, span * (S.availH / (S.availH + S.maxRowScroll)));
    const vt = S.scrollRow / S.maxRowScroll;
    const vyy = vy0 + vt * (span - vh);
    tctx.fillStyle = "rgba(255,255,255,.05)";
    roundRect(tctx, vx, vy0, 4, span, 2); tctx.fill();
    tctx.fillStyle = "#4a4a46";
    roundRect(tctx, vx, vyy, 4, vh, 2); tctx.fill();
    S.vsThumb = { x: vx, y: vyy, w: 4, h: vh, y0: vy0, span };
  } else {
    S.vsThumb = null;
  }

  drawPianoRoll();
}

/* ============================ 播放 ============================ */
let playStartBeat = 0, playStartT = 0;

function currentBeat(){
  if (!S.playing) return S.beat;
  if (S.audio) return Math.max(0, (S.audio.currentTime + S.audioOffset) * S.bpm / 60);
  return playStartBeat + (performance.now() - playStartT) / 1000 * S.bpm / 60;
}
function play(){
  if (S.playing) return;
  S.playing = true; playStartBeat = S.beat; playStartT = performance.now();
  if (S.audio){
    const at = S.beat * 60 / S.bpm - S.audioOffset;
    try { S.audio.currentTime = Math.max(0, at); } catch(e){}
    S.audio.play().catch(() => {});
  }
  document.getElementById("btnPlay").textContent = "⏸";
}
function stop(){
  S.playing = false;
  S.beat = currentBeat();
  if (S.audio) S.audio.pause();
  document.getElementById("btnPlay").textContent = "▶";
  applyAt(S.beat); draw(); drawTimeline(); updateTime();
  if (S.selected && S.tab === "props") syncNums(S.selected);
}
function togglePlay(){ S.playing ? stop() : play(); }
function setBeat(b){
  S.beat = Math.max(0, b);
  if (S.beat < S.scrollBeat || S.beat > S.scrollBeat + S.visibleBeats * 0.95){
    S.scrollBeat = clamp(S.beat - S.visibleBeats * 0.15, 0, S.maxScrollBeat);
  }
  applyAt(S.beat); draw(); drawTimeline(); updateTime();
}

function followPlayhead(){
  if (!S.playing) return;
  const right = S.scrollBeat + S.visibleBeats * 0.9;
  if (S.beat > right || S.beat < S.scrollBeat){
    S.scrollBeat = Math.max(0, S.beat - S.visibleBeats * 0.15);
  }
}

function updateTime(){
  const sec = S.beat * 60 / S.bpm;
  const dur = S.audio ? S.audioDur : (totalBeats * 60 / S.bpm);
  document.getElementById("timeLabel").innerHTML =
    sec.toFixed(2) + "s <em>/ " + dur.toFixed(2) + "s</em>";
}

function loop(){
  if (S.playing){
    S.beat = currentBeat();
    followPlayhead();
    applyAt(S.beat);
    draw(); drawTimeline(); updateTime();
    if (S.selected && S.tab === "props") syncNums(S.selected);
    if (S.audio && S.audio.ended) stop();
  }
  requestAnimationFrame(loop);
}

/* ============================ 图层列表 ============================ */
function renderLayers(){
  const box = document.getElementById("layerList");
  box.innerHTML = "";
  const mode = S.layerTab || "flat";
  document.getElementById("layerCount").textContent = S.parts.length + " 层";
  document.querySelectorAll("#layerTabs .ltab").forEach(t => t.classList.toggle("on", t.dataset.ltab === mode));

  const kidsOf = id => S.parts.filter(p => p.parentId === id);
  const roots = S.parts.filter(p => !p.parentId).slice().reverse();

  const buildRow = (p, depth, flat) => {
    const kids = kidsOf(p.id);
    const hasKids = kids.length > 0;
    const expanded = S.expanded[p.id] !== false;

    const el = document.createElement("div");
    el.className = "layer" + (S.selected === p ? " sel" : "") + (!flat && hasKids ? " folder" : "") + (!flat && depth > 0 ? " child" : "");
    el.draggable = true;
    el.dataset.id = p.id;
    el.style.paddingLeft = (7 + (flat ? 0 : depth * 13)) + "px";
    const parName = p.parentId ? (S.parts.find(q => q.id === p.parentId) || {}).slot : null;
    if (parName) el.title = "父级：" + parName + (flat ? "（拖到别的图层上可改顺序，Alt+拖 改父级）" : "");

    const chev = document.createElement("div");
    chev.className = (!flat && hasKids) ? "chev" : "chev-space";
    if (hasKids){
      chev.textContent = expanded ? "▾" : "▸";
      chev.onclick = ev => { ev.stopPropagation(); S.expanded[p.id] = !expanded; renderLayers(); };
    }
    el.appendChild(chev);

    const th = document.createElement("div");
    th.className = "thumb";
    const it = p.variants[0];
    if (it) th.innerHTML = '<img src="' + it.thumb + '">';

    const nm = document.createElement("div");
    nm.className = "lname";
    nm.textContent = p.slot;

    const eye = document.createElement("div");
    eye.className = "tog" + (p.visible ? "" : " off");
    eye.innerHTML = p.visible
      ? '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6s2-3.4 5-3.4S11 6 11 6s-2 3.4-5 3.4S1 6 1 6z" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="6" cy="6" r="1.5" fill="currentColor"/></svg>'
      : '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6s2-3.4 5-3.4S11 6 11 6s-2 3.4-5 3.4S1 6 1 6z" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M2 10L10 2" stroke="currentColor" stroke-width="1"/></svg>';
    eye.title = "显示 / 隐藏";
    eye.onclick = e => { e.stopPropagation(); pushUndo(); p.visible = !p.visible; renderAll(); };

    const lock = document.createElement("div");
    lock.className = "tog" + (p.locked ? "" : " off");
    lock.innerHTML = p.locked
      ? '<svg width="11" height="11" viewBox="0 0 12 12"><rect x="2.5" y="5.5" width="7" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1"/><path d="M4 5.5V4a2 2 0 014 0v1.5" fill="none" stroke="currentColor" stroke-width="1"/></svg>'
      : '<svg width="11" height="11" viewBox="0 0 12 12"><rect x="2.5" y="5.5" width="7" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1"/><path d="M4 5.5V4a2 2 0 013.4-1.5" fill="none" stroke="currentColor" stroke-width="1"/></svg>';
    lock.title = "锁定 / 解锁";
    lock.onclick = e => { e.stopPropagation(); pushUndo(); p.locked = !p.locked; renderAll(); };

    el.append(th);
    if (flat && p.parentId){
      const pin = document.createElement("span");
      pin.className = "pin";
      pin.textContent = "⤷";
      pin.title = "子图层，父级：" + (parName || "");
      el.appendChild(pin);
    }
    el.append(nm);
    if (p.variants.length > 1){
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = p.variants.length;
      el.appendChild(b);
    }
    if (hasKids){
      const b2 = document.createElement("span");
      b2.className = "badge";
      b2.textContent = kids.length;
      b2.title = "子图层数量";
      el.appendChild(b2);
    }
    el.append(eye, lock);

    el.onclick = () => selectPart(p);
    el.ondblclick = () => {
      const inp = document.createElement("input");
      inp.value = p.slot;
      nm.innerHTML = ""; nm.appendChild(inp);
      inp.focus(); inp.select();
      const commit = () => { p.slot = inp.value.trim() || p.slot; renderAll(); };
      inp.onblur = commit;
      inp.onkeydown = ev => { if (ev.key === "Enter") inp.blur(); if (ev.key === "Escape") renderAll(); };
    };

    el.ondragstart = e => { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", p.id); el.classList.add("dragging"); };
    el.ondragend = () => el.classList.remove("dragging");
    el.ondragover = e => { e.preventDefault(); el.classList.add("drop-top"); };
    el.ondragleave = () => el.classList.remove("drop-top");
    el.ondrop = e => {
      e.preventDefault();
      el.classList.remove("drop-top");
      const from = e.dataTransfer.getData("text/plain");
      if (!from || from === p.id) return;
      if (e.altKey){ reparent(from, p.id); return; }
      reorderLayer(from, p.id);
    };

    box.appendChild(el);
    if (!flat && hasKids && expanded) kids.slice().reverse().forEach(k => buildRow(k, depth + 1, false));
  };

  if (mode === "flat"){
    S.parts.slice().reverse().forEach(p => buildRow(p, 0, true));
    if (!S.parts.length) box.innerHTML = '<div class="lempty">还没有图层<br>把分层 PNG 拖进画布</div>';
  } else {
    roots.forEach(p => buildRow(p, 0, false));
    if (!S.parts.length) box.innerHTML = '<div class="lempty">还没有图层</div>';
  }
}

/* 图层 / 父子级 分页切换 */
document.querySelectorAll("#layerTabs .ltab").forEach(t => {
  t.onclick = () => {
    S.layerTab = t.dataset.ltab;
    renderLayers();
  };
});

function setParent(childId, parentId){
  const child = S.parts.find(p => p.id === childId);
  if (!child) return false;
  parentId = parentId || null;
  if (parentId === child.id){ toast("不能把自己设为父级"); return false; }

  if (parentId){
    const parent = S.parts.find(p => p.id === parentId);
    if (!parent){ toast("找不到父级图层"); return false; }
    let q = parent;
    while (q){
      if (q.id === childId){ toast("不能形成循环层级"); return false; }
      q = q.parentId ? S.parts.find(x => x.id === q.parentId) : null;
    }
  }

  pushUndo();
  const cm = worldOf(child);
  const pm = parentId ? worldOf(S.parts.find(p => p.id === parentId)) : rootMatrix();
  const det = pm.a * pm.d - pm.b * pm.c || 1e-6;
  const ia = pm.d / det, ib = -pm.b / det, ic = -pm.c / det, id = pm.a / det;
  const dx = cm.e - pm.e, dy = cm.f - pm.f;
  child.x = ia * dx + ic * dy;
  child.y = ib * dx + id * dy;

  child.parentId = parentId;
  if (parentId) S.expanded[parentId] = true;
  renderAll();

  const pn = parentId ? S.parts.find(p => p.id === parentId) : null;
  toast(pn ? "「" + child.slot + "」已放入「" + pn.slot + "」" : "「" + child.slot + "」已移出父级");
  return true;
}

function reparent(childId, parentId){ setParent(childId, parentId); }

function reorderLayer(fromId, toId){
  pushUndo();
  const from = S.parts.findIndex(p => p.id === fromId);
  const to = S.parts.findIndex(p => p.id === toId);
  if (from < 0 || to < 0) return;
  const [item] = S.parts.splice(from, 1);
  const idx = S.parts.findIndex(p => p.id === toId);
  S.parts.splice(idx + 1, 0, item);
  renderAll();
}

function ancestorFlip(p){
  let q = p.parentId ? S.parts.find(x => x.id === p.parentId) : null;
  let n = 0;
  while (q && n++ < 40){
    if (q.flipX || q.flipY) return true;
    q = q.parentId ? S.parts.find(x => x.id === q.parentId) : null;
  }
  return false;
}

function deleteVariant(p, i){
  if (!p) return;
  if (p.variants.length <= 1){ toast("至少要保留一张贴图"); return; }
  const name = p.variants[i] ? (p.variants[i].variant || "贴图 " + (i + 1)) : "";
  pushUndo();
  p.variants.splice(i, 1);
  if (p.texIndex >= p.variants.length) p.texIndex = p.variants.length - 1;
  else if (p.texIndex > i) p.texIndex--;
  applyPivot(p);
  for (const k of p.keys){
    if (k.tex !== undefined) k.tex = clamp(k.tex, 0, p.variants.length - 1);
  }
  touch(p);
  renderAll();
  toast("已删除贴图「" + name + "」，剩 " + p.variants.length + " 张");
}

/* ============================ 发丝摆动 ============================ */
const HAIR_DEFAULT = { damp: 0.86, gain: 0.85, max: 35, wind: 6, freq: 0.35, windOn: false, mesh: false, segs: 8 };

function partDepth(p){
  let d = 0, q = p;
  while (q && q.parentId && d < 50){
    q = S.parts.find(x => x.id === q.parentId);
    d++;
  }
  return d;
}

function hairTree(root){
  const out = [root];
  let grew = true;
  while (grew){
    grew = false;
    for (const p of S.parts){
      if (out.indexOf(p) >= 0) continue;
      if (p.parentId && out.some(q => q.id === p.parentId)){ out.push(p); grew = true; }
    }
  }
  return out.sort((a, b) => partDepth(a) - partDepth(b));
}

function bakeHairSway(root){
  if (!root) return;
  const list = hairTree(root).filter(p => p.parentId);
  if (!list.length){ toast("发丝要挂在父级图层下才能摆动"); return; }

  pushUndo();
  const fps = 24;
  const stepBeat = S.bpm / 60 / fps;
  const end = Math.max(projectEndBeat(), S.beat + 1);
  const n = Math.max(3, Math.ceil(end / stepBeat) + 1);
  let total = 0, skipped = 0, anyMesh = false;

  for (const p of list){
    if (S.clips.some(c => c.partId === p.id)){ skipped++; continue; }
    const sp = Object.assign({}, HAIR_DEFAULT, p.spring || {});
    p.spring = sp;
    const par = p.parentId ? S.parts.find(q => q.id === p.parentId) : null;

    // ① 采样：父级世界角 + 自身原始姿态（此时 p 的旧关键帧还在）
    const samples = [];
    for (let i = 0; i < n; i++){
      const beat = i * stepBeat;
      applyAt(beat);
      const pm = par ? worldOf(par) : rootMatrix();
      samples.push({ beat, prot: Math.atan2(pm.b, pm.a), px: pm.e, py: pm.f, snap: keySnapshot(p, beat) });
    }

    // ② 模拟
    const maxRad = sp.max * Math.PI / 180;
    const windRad = (sp.windOn ? sp.wind : 0) * Math.PI / 180;
    const phase = partDepth(p) * 0.8;
    const useMesh = !!(p.mesh && p.mesh.on && p.bend && p.bend.length);
    if (useMesh) anyMesh = true;
    const segs = useMesh ? Math.max(2, Math.min(500, p.mesh.segs || 32)) : 1;
    const N = samples.length;

    // 发丝在世界里的长度，用来把「位移」换算成「角度」
    const pm0 = par ? worldOf(par) : rootMatrix();
    const hairLen = Math.max(8, p.variants[p.texIndex].bbox.h * Math.hypot(pm0.a, pm0.b) * p.sy);

    // 驱动信号 = 父级转角差（取反，落后）+ 父级水平位移 / 发丝长度
    const drives = new Array(N).fill(0);
    let prev = samples[0].prot, ppx = samples[0].px, ppy = samples[0].py;
    for (let i = 0; i < N; i++){
      const sm = samples[i];
      let d = sm.prot - prev;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      prev = sm.prot;
      const dxW = sm.px - ppx, dyW = sm.py - ppy;
      ppx = sm.px; ppy = sm.py;
      const ca = Math.cos(-sm.prot), sa = Math.sin(-sm.prot);
      const localDx = dxW * ca - dyW * sa;
      drives[i] = (-d + localDx / hairLen) * sp.gain;
    }

    // 根部响应（一阶低通）
    const resp = new Array(N).fill(0);
    let lg = 0;
    for (let i = 0; i < N; i++){ lg = lg * sp.damp + drives[i]; resp[i] = lg; }
    const sampleAt = fi => {
      const i0 = Math.max(0, Math.min(N - 1, Math.floor(fi)));
      const i1 = Math.min(N - 1, i0 + 1);
      const fr = Math.max(0, Math.min(1, fi - i0));
      return resp[i0] * (1 - fr) + resp[i1] * fr;
    };
    const windAt = beat => windRad * Math.sin(2 * Math.PI * sp.freq * (beat * 60 / S.bpm) + phase);

    const keys = [];
    if (useMesh){
      // 权重：梢部略多分一点，总和归一化 → 总弯曲角与段数无关
      const wt = new Array(segs);
      let wsum = 0;
      for (let k = 0; k < segs; k++){ wt[k] = 1 + 0.6 * (k / segs); wsum += wt[k]; }
      for (let k = 0; k < segs; k++) wt[k] /= wsum;

      // 波沿发丝往下传：第 k 段取「根部响应」延迟一点点的值
      const delayFrames = 0.28 * fps;
      const clampT = v => Math.max(-maxRad, Math.min(maxRad, v));
      for (let i = 0; i < N; i++){
        const sm = samples[i];
        const kk = Object.assign({}, sm.snap);
        kk.t = sm.beat;
        const w = windAt(sm.beat);
        const bend = new Array(segs);
        for (let k = 0; k < segs; k++){
          const off = delayFrames * (k + 1) / segs;
          bend[k] = clampT(sampleAt(i - off) + w * (0.3 + 0.7 * k / segs)) * wt[k];
        }
        kk.bend = bend;
        keys.push(kk);
      }
    } else {
      for (let i = 0; i < N; i++){
        const sm = samples[i];
        const kk = Object.assign({}, sm.snap);
        kk.t = sm.beat;
        kk.rot = sm.snap.rot + Math.max(-maxRad, Math.min(maxRad, resp[i])) + windAt(sm.beat);
        keys.push(kk);
      }
    }
    p.keys = keys;
    total += keys.length;
  }

  applyAt(S.beat); draw(); drawTimeline(); renderInspector();
  toast((anyMesh ? "已生成形变：" : "已生成摆动：") + (list.length - skipped) + " 段、" + total + " 帧" +
        (skipped ? "（跳过 " + skipped + " 个有动作片段的图层）" : ""));
}

function flipPart(p, axis){
  if (!p) return;
  pushUndo();
  const clip = activeClipFor(p, S.beat);
  if (clip){                       // 播放头在片段里 → 改片段自己的镜像
    if (axis === "x") clip.flipX = !clip.flipX;
    else clip.flipY = !clip.flipY;
    p.flipX = !!clip.flipX; p.flipY = !!clip.flipY;
    draw(); drawTimeline(); renderInspector();
    const on = axis === "x" ? clip.flipX : clip.flipY;
    toast("片段「" + p.slot + "」" + (on ? "已" : "取消") + (axis === "x" ? "水平" : "垂直") + "镜像");
    return;
  }
  if (axis === "x") p.flipX = !p.flipX;
  else p.flipY = !p.flipY;
  // 有动画的图层必须落帧，否则下一次 applyAt 会把镜像回滚掉
  if (S.record || p.keys.length) touchForce(p);
  draw(); drawTimeline(); renderInspector();
  const on = axis === "x" ? p.flipX : p.flipY;
  toast("「" + p.slot + "」" + (on ? "已" : "取消") + (axis === "x" ? "水平" : "垂直") + "镜像");
}

function mirrorSelection(axis){
  const keys = [];
  if (S.selKeys && S.selKeys.length) keys.push(...S.selKeys);
  else if (S.selKey){
    const p = S.parts.find(x => x.id === S.selKey.partId);
    const k = p && p.keys.find(x => Math.abs(x.t - S.selKey.t) < 1e-3);
    if (k) keys.push({ partId: p.id, key: k });
  }
  const clips = (S.selClips || []).slice();
  if (!keys.length && !clips.length){ toast("先在时间轴上选中关键帧或片段"); return; }

  pushUndo();
  for (const it of keys){
    const k = it.key;
    if (!k) continue;
    if (axis === "x") k.flipX = !k.flipX;
    else k.flipY = !k.flipY;
  }
  for (const c of clips){
    if (axis === "x") c.flipX = !c.flipX;
    else c.flipY = !c.flipY;
  }
  applyAt(S.beat); draw(); drawTimeline(); renderInspector();
  const bits = [];
  if (keys.length) bits.push(keys.length + " 个关键帧");
  if (clips.length) bits.push(clips.length + " 个片段");
  toast("已镜像 " + bits.join("、") + "（" + (axis === "x" ? "水平" : "垂直") + "）");
}

function isRootPart(p){
  return !p.parentId || !S.parts.some(q => q.id === p.parentId);
}

function resizeDoc(nw, nh, scaleContent){
  nw = Math.max(16, Math.round(nw || S.doc.w));
  nh = Math.max(16, Math.round(nh || S.doc.h));
  const ow = S.doc.w || nw, oh = S.doc.h || nh;
  if (scaleContent && S.parts.length && ow > 0 && oh > 0 && (ow !== nw || oh !== nh)){
    const kx = nw/ow, ky = nh/oh;
    // 只改一边 → 按改的那一边缩放；两边都改 → 取较小值，保证内容装得下
    let k;
    if (Math.abs(kx - 1) < 1e-6) k = ky;
    else if (Math.abs(ky - 1) < 1e-6) k = kx;
    else k = Math.min(kx, ky);
    const offX = (nw - ow*k)/2, offY = (nh - oh*k)/2;
    for (const p of S.parts){
      if (!isRootPart(p)) continue;   // 子级跟着父级矩阵自动缩放
      p.x = p.x*k + offX; p.y = p.y*k + offY;
      p.sx *= k; p.sy *= k;
      for (const key of p.keys){
        key.x = key.x*k + offX; key.y = key.y*k + offY;
        key.sx *= k; key.sy *= k;
      }
    }
    for (const c of S.clips){
      const part = S.parts.find(q => q.id === c.partId);
      if (!part || !isRootPart(part)) continue;
      c.base.x = c.base.x*k + offX; c.base.y = c.base.y*k + offY;
      c.base.sx *= k; c.base.sy *= k;
    }
  }
  S.doc = { w: nw, h: nh };
}

function selectPart(p){
  if (S.selected !== p){ S.selected = p; clearSel(); }
  renderAll();
}

}

  }

    return;
  }
  const cur = k.ease && k.ease.p ? k.ease.p : null;
  box.innerHTML =
    '<div class="sec">关键帧 ' + k.t.toFixed(2) + ' 拍 · ' + (part ? part.slot : "") + '</div>' +

      EASE_PRESETS.map((e, i) => '<button data-i="' + i + '">' + e.name + '</button>').join("") +
    '</div>' +
    '<div id="curveBox"><canvas id="curve"></canvas></div>' +
    '<div style="padding:0 10px 10px;color:var(--dim);font-size:10.5px;line-height:1.6">拖动两个控制点可自定义曲线；纵轴越高的部分速度越快。</div>';
