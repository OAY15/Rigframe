}

function drawCurveEditor(k){
  const cv = document.getElementById("curve");
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 240, H = cv.clientHeight || 118;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  const pad = 14;
  const w = W - pad*2, h = H - pad*2;
  const X = v => pad + v * w;
  const Y = v => pad + h - v * h;

  g.strokeStyle = "#232323"; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++){
    g.beginPath(); g.moveTo(X(i/4), pad); g.lineTo(X(i/4), pad + h); g.stroke();
    g.beginPath(); g.moveTo(pad, Y(i/4)); g.lineTo(pad + w, Y(i/4)); g.stroke();
  }
  g.strokeStyle = "#3a3a3a";
  g.beginPath(); g.moveTo(X(0), Y(0)); g.lineTo(X(1), Y(1)); g.stroke();

  const p = k.ease && k.ease.p ? k.ease.p : null;
  g.strokeStyle = "#5DCAA5"; g.lineWidth = 1.6;
  g.beginPath();
  if (!p){
    g.moveTo(X(0), Y(0)); g.lineTo(X(1), Y(0)); g.lineTo(X(1), Y(1));
  } else {
    for (let i = 0; i <= 40; i++){
      const x = i / 40;
      const y = bezierY(x, p);
      if (i === 0) g.moveTo(X(x), Y(y)); else g.lineTo(X(x), Y(y));
    }
  }
  g.stroke();

  if (p){
    g.strokeStyle = "#4a7f6f"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(X(0), Y(0)); g.lineTo(X(p[0]), Y(p[1])); g.stroke();
    g.beginPath(); g.moveTo(X(1), Y(1)); g.lineTo(X(p[2]), Y(p[3])); g.stroke();
    [[p[0], p[1], "#85B7EB"], [p[2], p[3], "#F0997B"]].forEach(([x, y, c]) => {
      g.fillStyle = c;
      g.beginPath(); g.arc(X(x), Y(y), 4.5, 0, Math.PI*2); g.fill();
    });
    cv.dataset.p = JSON.stringify(p);
  }

  bindCurveCanvas(cv);
}

let curveDrag = null;

function curveGeom(cv){
  const pad = 14;
  const W = cv.clientWidth || 240, H = cv.clientHeight || 118;
  const w = W - pad*2, h = H - pad*2;
  return { pad, w, h, X: v => pad + v*w, Y: v => pad + h - v*h };
}

function bindCurveCanvas(cv){
  cv.onpointerdown = e => {
    const k = currentCurveKey();
    if (!k || !k.ease || !k.ease.p) return;
    const { X, Y } = curveGeom(cv);
    const r = cv.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const p = k.ease.p;
    const d0 = Math.hypot(mx - X(p[0]), my - Y(p[1]));
    const d1 = Math.hypot(mx - X(p[2]), my - Y(p[3]));
    curveDrag = d0 < d1 ? 0 : 1;
    beginEdit();
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
    e.preventDefault();
    cv.onpointermove(e);
  };
  cv.onpointermove = e => {
    if (curveDrag === null) return;
    const k = currentCurveKey();
    if (!k || !k.ease || !k.ease.p) return;
    const { pad, w, h } = curveGeom(cv);
    const r = cv.getBoundingClientRect();
    const vx = clamp((e.clientX - r.left - pad) / w, 0, 1);
    const vy = (pad + h - (e.clientY - r.top)) / h;
    const p = k.ease.p;
    if (curveDrag === 0){ p[0] = vx; p[1] = vy; }
    else { p[2] = vx; p[3] = vy; }
    applyAt(S.beat); draw(); drawTimeline(); drawCurveEditor(k);
  };
  cv.onpointerup = () => {
    if (curveDrag !== null){ curveDrag = null; endEdit(); }
  };
  cv.onpointercancel = () => { curveDrag = null; };
}

function currentCurveKey(){
  if (!S.selKey || !S.selKey.key) return null;
  const part = S.parts.find(p => p.id === S.selKey.partId);
  if (!part) return null;
  return part.keys.indexOf(S.selKey.key) >= 0 ? S.selKey.key : null;
}

/* ---------- 自定义组件 ---------- */
function makeComponentFromSelection(){
  let part = null, keys = null;

  if (S.selKeys.length >= 2){
    const counts = {};
    S.selKeys.forEach(s => { counts[s.partId] = (counts[s.partId] || 0) + 1; });
    const partId = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    part = S.parts.find(p => p.id === partId);
    keys = S.selKeys.filter(s => s.partId === partId).map(s => s.key).sort((a, b) => a.t - b.t);
    if (!part || keys.length < 2){ toast("至少选中同一图层的两个关键帧"); return; }
  } else {
    part = S.selected;
    if (!part){ toast("先在左侧选一个图层，或在时间轴上选中关键帧"); return; }
    if (part.keys.length < 2){
      toast("「" + part.slot + "」只有 " + part.keys.length + " 个关键帧，至少需要 2 个");
      return;
    }
    keys = part.keys.slice().sort((a, b) => a.t - b.t);
  }

  const t0 = keys[0].t, k0 = keys[0];
  const arr = keys.map(k => ({
    t: +(k.t - t0).toFixed(4),
    x: +(k.x - k0.x).toFixed(3),
    y: +(k.y - k0.y).toFixed(3),
    rot: +(k.rot - k0.rot).toFixed(5),
    sx: +(k0.sx ? k.sx / k0.sx : 1).toFixed(4),
    sy: +(k0.sy ? k.sy / k0.sy : 1).toFixed(4),
    alpha: +(k0.alpha ? k.alpha / k0.alpha : 1).toFixed(4),
    tex: k.tex
  }));

  askName("给这个组件起个名字（" + arr.length + " 个关键帧）", part.slot + " 动作", name => {
    pushUndo();
    const comp = {
      id: "u" + Date.now().toString(36),
      cat: "我的", name, ico: "★", target: "any",
      rel: true, custom: true, keys: arr
    };
    ACTION_LIB.push(comp);
    saveCustomActions();

    const span = Math.max(0.25, arr[arr.length - 1].t);
    part.keys = part.keys.filter(k => keys.indexOf(k) < 0);
    const clip = {
      id: "c" + (++uid),
      partId: part.id,
      actionId: comp.id,
      start: t0,
      dur: span,
      base: { x: k0.x, y: k0.y, rot: k0.rot, sx: k0.sx, sy: k0.sy, alpha: k0.alpha, tex: k0.tex }
    };
    S.clips.push(clip);
    S.selected = part;
    S.selKeys = []; S.selKey = null;
    S.selClips = [clip]; S.selectedClip = clip;

    S.tab = "action";
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.tab === "action"));
    applyAt(S.beat);
    renderAll();
    toast("已存为组件「" + name + "」，关键帧已替换为片段（右键可分解回来）");
  });
}

function clipKeyAbs(clip, a, k){
  const b = clip.base;
  const rel = !!a.rel;
  return {
    x: b.x + (k.x !== undefined ? k.x : 0),
    y: b.y + (k.y !== undefined ? k.y : 0),
    rot: b.rot + (k.rot !== undefined ? k.rot : 0),
    sx: k.sx !== undefined ? (rel ? b.sx * k.sx : k.sx) : b.sx,
    sy: k.sy !== undefined ? (rel ? b.sy * k.sy : k.sy) : b.sy,
    alpha: k.alpha !== undefined ? (rel ? b.alpha * k.alpha : k.alpha) : b.alpha,
    tex: k.tex !== undefined ? k.tex : b.tex
  };
}

function expandClip(clip){
  if (!clip) return;
  const a = ACTION_LIB.find(x => x.id === clip.actionId);
  const part = S.parts.find(p => p.id === clip.partId);
  if (!a || !part){ toast("找不到对应组件或图层"); return; }

  const span = a.keys[a.keys.length - 1].t || clip.dur;
  pushUndo();
  a.keys.forEach(k => {
    const tt = +(clip.start + (span > 1e-6 ? (k.t / span) * clip.dur : 0)).toFixed(4);
    const abs = clipKeyAbs(clip, a, k);
    abs.t = tt;
    abs.ease = a.instant ? { p: null } : { p: [0.42, 0, 0.58, 1] };
    part.keys = part.keys.filter(x => Math.abs(x.t - tt) > 1e-3);
    part.keys.push(abs);
  });
  part.keys.sort((x, y) => x.t - y.t);
  S.clips = S.clips.filter(c => c !== clip);
  clearSel();
  S.selected = part;
  applyAt(S.beat);
  renderAll();
  toast("已分解为 " + a.keys.length + " 个关键帧");
}

function deleteCustom(id){
  const i = ACTION_LIB.findIndex(a => a.id === id);
  if (i < 0) return;
  pushUndo();
  ACTION_LIB.splice(i, 1);
  S.clips = S.clips.filter(c => c.actionId !== id);
  saveCustomActions();
  clearSel();
  applyAt(S.beat); renderAll();
  toast("已删除组件");
}

function saveCustomActions(){
  try {
    localStorage.setItem("rigframe.customActions", JSON.stringify(ACTION_LIB.filter(a => a.custom)));

function loadCustomActions(){
  try {
    // 兼容旧版键名，改名后用户存过的组件不会丢
    const raw = localStorage.getItem("rigframe.customActions") || localStorage.getItem("meme.customActions");
    if (!raw) return;
    JSON.parse(raw).forEach(a => {
      if (a && a.id && a.keys && !ACTION_LIB.some(x => x.id === a.id)) ACTION_LIB.push(a);
    });
  } catch(e){}
}

/* ============================ 画布交互 ============================ */
let drag = null;
let pivotDrag = null;
let panDrag = null;
let gizmoDrag = null;

function movePivotTo(mx, my){
  const { p, it } = pivotDrag;
  const m = worldOf(p);
  const det = m.a*m.d - m.b*m.c || 1e-6;
  const dx = mx - m.e, dy = my - m.f;
  const u = ( m.d*dx - m.c*dy)/det + it.ax;
  const v = (-m.b*dx + m.a*dy)/det + it.ay;
  setPivot(p, it, u, v);
  draw();
  const fx = document.getElementById("fPx"), fy = document.getElementById("fPy");
  if (fx) fx.value = Math.round(p.ax);
  if (fy) fy.value = Math.round(p.ay);
}

/* 命中测试：bbox 内再按贴图 alpha 判定，点在透明处会自动落到下方图层 */
function alphaHitAt(it, u, v){
  const img = it.img;
  if (!img || !img.width) return true;
  const map = alphaMapOf(img);
  if (!map) return true;
  const mx = clamp(Math.floor(u / img.width * map.w), 0, map.w - 1);
  const my = clamp(Math.floor(v / img.height * map.h), 0, map.h - 1);
  return map.a[my * map.w + mx] > 10;
}

function hitPart(mx, my){
  let loose = null;                    // 全部透明的兜底：最上面那个 bbox 命中
  for (let i = S.parts.length - 1; i >= 0; i--){
    const p = S.parts[i];
    if (!p.visible || p.locked) continue;
    const it = p.variants[p.texIndex] || p.variants[0];
    if (!it) continue;
    const m = worldOf(p);
    const det = m.a*m.d - m.b*m.c || 1e-6;
    const dx = mx - m.e, dy = my - m.f;
    const u = ( m.d*dx - m.c*dy)/det + it.ax;
    const v = (-m.b*dx + m.a*dy)/det + it.ay;
    const bb = it.bbox;
    if (u >= bb.x && v >= bb.y && u <= bb.x + bb.w && v <= bb.y + bb.h){
      if (alphaHitAt(it, u, v)) return p;
      if (!loose) loose = p;
    }
  }
  return loose;
}

function setPivot(p, it, nax, nay){
  const bb = it.bbox;
  const u = bb.w ? (nax - bb.x) / bb.w : 0.5;
  const v = bb.h ? (nay - bb.y) / bb.h : 0.5;
  const dax = nax - it.ax, day = nay - it.ay;
  if (Math.abs(dax) < 1e-6 && Math.abs(day) < 1e-6) return;
  const c = Math.cos(p.rot), s = Math.sin(p.rot);
  p.x += c * dax * p.sx - s * day * p.sy;
  p.y += s * dax * p.sx + c * day * p.sy;
  p.pu = u; p.pv = v;
  applyPivot(p);

  // 子级的坐标是相对父级原点（轴心）的，轴心一动子级就会整体漂移。
  // 把子级局部坐标反向平移 (dax, day)，正好抵消，视觉上原地不动。
  for (const ch of S.parts){
    if (ch.parentId !== p.id) continue;
    ch.x -= dax; ch.y -= day;
    for (const k of ch.keys){ k.x -= dax; k.y -= day; }
    for (const cl of S.clips){
      if (cl.partId === ch.id && cl.base){ cl.base.x -= dax; cl.base.y -= day; }
    }
  }
}

view.addEventListener("pointerdown", e => {
  const r = view.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;

  if (e.button === 1){
    e.preventDefault();
    panDrag = { mx, my, ox: S.view.ox, oy: S.view.oy };
    try { view.setPointerCapture(e.pointerId); } catch(err){}
    view.style.cursor = "grabbing";
    return;
  }
  if (e.button !== 0) return;

  if (S.playing) stop();

  if (S.pivotMode && S.selected){
    const p = S.selected;
    const it = p.variants[p.texIndex] || p.variants[0];
    beginEdit();
    pivotDrag = { p, it };
    movePivotTo(mx, my);
    try { view.setPointerCapture(e.pointerId); } catch(err){}
    e.preventDefault();
    return;
  }

  if (S.selected && !S.selected.locked){
    const gh = hitGizmo(mx, my);
    if (gh){
      const p = S.selected;
      if (gh.type === "del"){ pushUndo(); deletePart(p); return; }
      if (gh.type === "dup"){ pushUndo(); duplicatePart(p); return; }
      beginEdit();
      if (gh.type === "rot"){
        const par = p.parentId ? S.parts.find(q => q.id === p.parentId) : null;
        const pm = par ? worldOf(par) : rootMatrix();
        const a = invLinear(pm, mx - pm.e, my - pm.f);
        gizmoDrag = { type: "rot", p, pm, rot0: p.rot, a0: Math.atan2(a.y - p.y, a.x - p.x) };
      } else {
        gizmoDrag = { type: "scale", p, i: gh.i, m0: gh.g.m, sx0: p.sx, sy0: p.sy, L: gh.g.L };
      }
      try { view.setPointerCapture(e.pointerId); } catch(err){}
      e.preventDefault();
      return;
    }
  }

  const hit = hitPart(mx, my);

  if (!hit && S.selected){
    clearSel();
    S.selected = null;
    renderAll();
    return;
  }
  if (hit && hit !== S.selected) selectPart(hit);
  if (!hit) return;

  beginEdit();
  drag = { p: hit, mx, my, x0: hit.x, y0: hit.y, rot0: hit.rot, mode: e.shiftKey ? "rot" : "move" };
  view.setPointerCapture(e.pointerId);
});

view.addEventListener("pointermove", e => {
  const r = view.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;

  if (panDrag){
    S.view.ox = panDrag.ox + (mx - panDrag.mx);
    S.view.oy = panDrag.oy + (my - panDrag.my);
    draw();
    return;
  }
  if (pivotDrag){
    movePivotTo(mx, my);
    return;
  }
  if (gizmoDrag){
    const d = gizmoDrag, p = d.p;
    if (d.type === "rot"){
      const a = invLinear(d.pm, mx - d.pm.e, my - d.pm.f);
      let delta = Math.atan2(a.y - p.y, a.x - p.x) - d.a0;
      const deg = delta * 180 / Math.PI;
      const snapDeg = Math.round(deg / 15) * 15;
      if (!e.altKey && Math.abs(deg - snapDeg) < 3) delta = snapDeg * Math.PI / 180;
      p.rot = d.rot0 + delta;
    } else {
      const L = invLinear(d.m0, mx - d.m0.e, my - d.m0.f);
      const C = d.L[d.i];
      const kx = Math.abs(C[0]) > 1 ? L.x / C[0] : 1;
      const ky = Math.abs(C[1]) > 1 ? L.y / C[1] : 1;
      let fx = kx, fy = ky;
      if (S.linkScale || e.shiftKey){ const k = (kx + ky) / 2; fx = fy = k; }
      p.sx = clamp(d.sx0 * fx, 0.05, 8);
      p.sy = clamp(d.sy0 * fy, 0.05, 8);
    }
    touch(p);
    draw(); drawTimeline(); syncNums(p);
    return;
  }
  if (!drag){
    if (!panDrag){
      const gh = (S.selected && !S.selected.locked) ? hitGizmo(mx, my) : null;
      view.style.cursor = !gh ? (S.pivotMode ? "crosshair" : "default")
        : gh.type === "rot" ? "grab" : gh.type === "scale" ? "nwse-resize" : "pointer";
    }
    return;
  }

  const p = drag.p;
  const par = p.parentId ? S.parts.find(q => q.id === p.parentId) : null;
  const pm = par ? worldOf(par) : rootMatrix();

  if (drag.mode === "rot"){
    const c = worldOf(p);
    const a0 = Math.atan2(drag.my - c.f, drag.mx - c.e);
    const a1 = Math.atan2(my - c.f, mx - c.e);
    p.rot = drag.rot0 + (a1 - a0);
  } else {
    const d = invLinear(pm, mx - drag.mx, my - drag.my);
    p.x = drag.x0 + d.x;
    p.y = drag.y0 + d.y;
  }
  touch(p);
  draw(); drawTimeline(); syncNums(p);
});

view.addEventListener("pointerup", e => {
  if (panDrag){
    panDrag = null;
    view.style.cursor = S.pivotMode ? "crosshair" : "default";
    try { view.releasePointerCapture(e.pointerId); } catch(err){}
    return;
  }
  if (pivotDrag){
    pivotDrag = null;
    endEdit();
    try { view.releasePointerCapture(e.pointerId); } catch(err){}
    renderInspector();
    return;
  }
  if (gizmoDrag){
    gizmoDrag = null;
    endEdit();
    try { view.releasePointerCapture(e.pointerId); } catch(err){}
    renderInspector(); drawTimeline();
    return;
  }
  if (drag){
    try { view.releasePointerCapture(e.pointerId); } catch(err){}
    drag = null; endEdit(); drawTimeline(); renderInspector();
  }
});

/* ---- 视图缩放（镜头） ---- */
function zoomViewAt(mx, my, k){
  const old = S.view.scale;
  const ns = clamp(old * k, 0.02, 24);
  if (Math.abs(ns - old) < 1e-9) return;
  S.view.ox = mx - (mx - S.view.ox) * (ns / old);
  S.view.oy = my - (my - S.view.oy) * (ns / old);
  S.view.scale = ns;
  draw();
}
function zoomViewCenter(k){
  zoomViewAt(view.clientWidth / 2, view.clientHeight / 2, k);
}
function setViewScale100(){
  S.view.scale = 1;
  S.view.ox = (view.clientWidth - S.doc.w) / 2;
  S.view.oy = (view.clientHeight - S.doc.h) / 2;
  draw();
}

view.addEventListener("wheel", e => {
  e.preventDefault();

  // Alt + 滚轮：缩放选中的部件（保留旧操作习惯）
  if (e.altKey && S.selected && !S.selected.locked){
    const p = S.selected;
    beginEdit();
    const k = e.deltaY > 0 ? 0.94 : 1.06;
    p.sx = clamp(p.sx * k, 0.05, 5);
    p.sy = clamp(p.sy * k, 0.05, 5);
    touch(p); draw(); syncNums(p);
    clearTimeout(view._wt);
    view._wt = setTimeout(endEdit, 260);
    return;
  }

  const r = view.getBoundingClientRect();
  const step = e.deltaMode === 1 ? 0.05 : 0.0015;
  zoomViewAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * step));
}, { passive: false });

view.addEventListener("mousedown", e => { if (e.button === 1) e.preventDefault(); });

view.addEventListener("contextmenu", e => {
  e.preventDefault();
  const fit = () => { fitView(); draw(); };
  showMenu(e.clientX, e.clientY, [
    { label: "适应窗口", key: "Fit", fn: fit },
    { label: "实际大小 100%", fn: setViewScale100 },
    "-",
    { label: "放大", key: "+", fn: () => zoomViewCenter(1.2) },
    { label: "缩小", key: "−", fn: () => zoomViewCenter(1 / 1.2) },
    "-",
    { label: "缩放重置", fn: () => { fitView(); draw(); } }
  ]);
});

function syncNums(p){
  const busy = el => el && el === document.activeElement;
  const x = document.getElementById("fX"), y = document.getElementById("fY"), r = document.getElementById("fRot");
  const sx = document.getElementById("fSx"), sy = document.getElementById("fSy"), al = document.getElementById("fAlpha");
  if (x && !busy(x)) x.value = Math.round(p.x);
  if (y && !busy(y)) y.value = Math.round(p.y);
  if (r && !busy(r)){
    r.value = Math.round(p.rot*180/Math.PI);
    const v = document.getElementById("vRot"); if (v) v.textContent = r.value + "°";
  }
  if (sx && !busy(sx)){
    sx.value = Math.round(p.sx*100);
    const v = document.getElementById("vSx"); if (v) v.textContent = sx.value + "%";
  }
  if (sy && !busy(sy)){
    sy.value = Math.round(p.sy*100);
    const v = document.getElementById("vSy"); if (v) v.textContent = sy.value + "%";
  }
  if (al && !busy(al)){
    al.value = Math.round(p.alpha*100);
    const v = document.getElementById("vAlpha"); if (v) v.textContent = al.value + "%";
  }
  updateClipHint(p);
}

/* ============================ 时间轴交互 ============================ */
let tlDrag = null;

function tlX(e){ return e.clientX - tl.getBoundingClientRect().left; }
function tlY(e){ return e.clientY - tl.getBoundingClientRect().top; }

function hitTestTimeline(mx, my){
  for (let i = 0; i < S.cues.length; i++){
    if (Math.abs(xOf(S.cues[i]) - mx) < 7 && my < rulerH + 2) return { type: "cue", idx: i };
  }
  for (const { p, y } of tlRows){
    if (my < y || my > y + rowH) continue;
    for (const c of S.clips.filter(c => c.partId === p.id)){
      const x1 = xOf(c.start), x2 = xOf(c.start + c.dur);
      if (mx >= x1 - 4 && mx <= x2 + 4) return { type: "clip", clip: c, part: p, edge: Math.abs(mx - x2) <= 7 };
    }
    for (const k of p.keys){
      if (Math.abs(xOf(k.t) - mx) < 10) return { type: "key", key: k, part: p };
    }
  }
  return { type: "playhead" };
}

tl.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;   // 右键交给 contextmenu 处理，避免它顺带清空多选
  const mx = tlX(e), my = tlY(e);
  hideMenu();

  const hs = S.hsThumb;
  if (hs && my >= hs.y - 4 && my <= hs.y + hs.h + 5 && mx >= hs.tx0 - 2 && mx <= hs.tx0 + hs.trackW + 2){
    if (mx >= hs.x && mx <= hs.x + hs.w){
      tlDrag = { type: "hscroll", off: mx - hs.x };
    } else {
      S.scrollBeat = clamp((mx - hs.tx0 - hs.w/2) / Math.max(1, hs.trackW - hs.w) * S.maxScrollBeat, 0, S.maxScrollBeat);
      tlDrag = { type: "hscroll", off: hs.w/2 };
      drawTimeline();
    }
    try { tl.setPointerCapture(e.pointerId); } catch(err){}
    return;
  }

  const vs = S.vsThumb;
  if (vs && mx >= vs.x - 4 && my >= vs.y0 && my <= vs.y0 + vs.span){
    if (my >= vs.y && my <= vs.y + vs.h){
      tlDrag = { type: "vscroll", off: my - vs.y };
    } else {
      S.scrollRow = clamp((my - vs.y0 - vs.h/2) / Math.max(1, vs.span - vs.h) * S.maxRowScroll, 0, S.maxRowScroll);
      tlDrag = { type: "vscroll", off: vs.h/2 };
      drawTimeline();
    }
    try { tl.setPointerCapture(e.pointerId); } catch(err){}
    return;
  }

  if (mx < labelW && my > rulerH){
    const row = tlRows.find(r => my >= r.y && my <= r.y + rowH);
    if (row) selectPart(row.p);
    return;
  }

  const hit = hitTestTimeline(mx, my);
  const additive = e.shiftKey;

  if (hit.type === "cue"){
    tlDrag = { type: "cue", idx: hit.idx };
    try { tl.setPointerCapture(e.pointerId); } catch(err){}
    return;
  }

  if (hit.type === "clip"){
    if (S.selected !== hit.part) selectPart(hit.part);
    const already = S.selClips.indexOf(hit.clip) >= 0;
    if (!additive && already) S.selectedClip = hit.clip;
    else selClipToggle(hit.clip, additive);
    drawTimeline();
    if (additive) return;
    const items = S.selClips.map(c => ({ c, s0: c.start }));
    tlDrag = {
      type: hit.edge ? "clip-resize" : "clip-move",
      clip: hit.clip, grab: beatOf(mx) - hit.clip.start,
      anchorStart: hit.clip.start, items
    };
    try { tl.setPointerCapture(e.pointerId); } catch(err){}
    return;
  }

  if (hit.type === "key"){
    if (S.selected !== hit.part) selectPart(hit.part);
    const already = S.selKeys.some(s => s.key === hit.key);
    if (!additive && already){
      const hitSel = S.selKeys.find(s => s.key === hit.key);
      if (hitSel) setSelKey(hitSel.partId, hitSel.key);
    }
    else selKeyToggle(hit.part.id, hit.key, additive);
    // 播放头跟到这一帧，改属性才是改这一帧
    if (!additive && Math.abs(S.beat - hit.key.t) > 1e-4) setBeat(hit.key.t);
    drawTimeline();
    if (additive) return;
    const items = S.selKeys.map(s => ({ s, t0: s.key.t }));
    tlDrag = { type: "key", p: hit.part, k: hit.key, anchor: hit.key.t, items };
    try { tl.setPointerCapture(e.pointerId); } catch(err){}
    return;
  }

  if (my < rulerH){
    tlDrag = { type: "playhead" };
    try { tl.setPointerCapture(e.pointerId); } catch(err){}
    scrubTo(mx);
    return;
  }

  tlDrag = { type: "maybe-marquee", x0: mx, y0: my, additive };
  try { tl.setPointerCapture(e.pointerId); } catch(err){}
});

function applyMarquee(additive){
  const m = S.marquee;
  if (!m) return;
  const x1 = Math.min(m.x1, m.x2), x2 = Math.max(m.x1, m.x2);
  const y1 = Math.min(m.y1, m.y2), y2 = Math.max(m.y1, m.y2);
  if (!additive){ S.selKeys = []; S.selClips = []; }

  for (const { p, y } of tlRows){
    if (y + rowH < y1 || y > y2) continue;
    for (const k of p.keys){
      const x = xOf(k.t);
      if (x >= x1 && x <= x2 && !S.selKeys.some(s => s.key === k)) S.selKeys.push({ partId: p.id, key: k });
    }
    for (const c of S.clips.filter(c => c.partId === p.id)){
      const cx = (xOf(c.start) + xOf(c.start + c.dur)) / 2;
      if (cx >= x1 && cx <= x2 && S.selClips.indexOf(c) < 0) S.selClips.push(c);
    }
  }
  const lastK = S.selKeys[S.selKeys.length - 1];
  setSelKey(lastK ? lastK.partId : null, lastK ? lastK.key : null);
  S.selectedClip = S.selClips[0] || null;
}

window.addEventListener("pointermove", e => {
  if (!tlDrag) return;
  const mx = tlX(e), my = tlY(e);
  const t = tlDrag.type;

  if (t === "playhead"){
    scrubTo(mx);
  } else if (t === "hscroll"){
    const hs = S.hsThumb;
    if (!hs) return;
    const ratio = (mx - tlDrag.off - hs.tx0) / Math.max(1, hs.trackW - hs.w);
    S.scrollBeat = clamp(ratio * S.maxScrollBeat, 0, S.maxScrollBeat);
    drawTimeline();
  } else if (t === "vscroll"){
    const vs = S.vsThumb;
    if (!vs) return;
    const ratio = (my - tlDrag.off - vs.y0) / Math.max(1, vs.span - vs.h);
    S.scrollRow = clamp(ratio * S.maxRowScroll, 0, S.maxRowScroll);
    drawTimeline();
  } else if (t === "cue"){
    let b = Math.max(0, beatOf(mx));
    if (S.snap) b = Math.round(b * 4) / 4;
    S.cues[tlDrag.idx] = b;
    drawTimeline();
  } else if (t === "key"){
    let b = Math.max(0, beatOf(mx));
    if (S.snap) b = Math.round(b * 4) / 4;
    const delta = b - tlDrag.anchor;
    const touched = new Set();
    tlDrag.items.forEach(it => {
      it.s.key.t = Math.max(0, it.t0 + delta);
      touched.add(it.s.partId);
    });
    touched.forEach(pid => {
      const p = S.parts.find(x => x.id === pid);
      if (p) p.keys.sort((a, c) => a.t - c.t);
    });
    // 播放头跟着被拖的帧走，否则改属性会落到别的时刻
    const prim = tlDrag.items.find(it => S.selKey && it.s.partId === S.selKey.partId);
    if (prim){ setSelKey(prim.s.partId, prim.s.key); S.beat = prim.s.key.t; }
    applyAt(S.beat); draw(); drawTimeline(); updateTime();
  } else if (t === "clip-move"){
    let b = Math.max(0, beatOf(mx) - tlDrag.grab);
    if (S.snap) b = Math.round(b * 4) / 4;
    const delta = b - tlDrag.anchorStart;
    tlDrag.items.forEach(it => { it.c.start = Math.max(0, it.s0 + delta); });
    applyAt(S.beat); draw(); drawTimeline();
  } else if (t === "clip-resize"){
    let b = beatOf(mx) - tlDrag.clip.start;
    if (S.snap) b = Math.round(b * 4) / 4;
    tlDrag.clip.dur = Math.max(0.25, b);
    applyAt(S.beat); draw(); drawTimeline();
  } else if (t === "maybe-marquee" || t === "marquee"){
    if (t === "maybe-marquee"){
      if (Math.hypot(mx - tlDrag.x0, my - tlDrag.y0) < 4) return;
      tlDrag.type = "marquee";
    }
    S.marquee = { x1: tlDrag.x0, y1: tlDrag.y0, x2: mx, y2: my };
    applyMarquee(tlDrag.additive);
    drawTimeline();
  }
});

window.addEventListener("pointerup", () => {
  if (!tlDrag) return;
  const t = tlDrag.type;
  const startX = tlDrag.x0;
  tlDrag = null;
  S.marquee = null;

  if (t === "maybe-marquee"){
    scrubTo(startX);
  } else if (t === "playhead" || t === "hscroll" || t === "vscroll"){
    drawTimeline();
  } else {
    applyAt(S.beat); draw(); drawTimeline();
  }
  if (S.tab === "curve") renderInspector();
});

tl.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey){
    const mx = Math.max(labelW + 8, tlX(e));
    zoomAt(S.zoom * (e.deltaY > 0 ? 0.88 : 1.14), mx);
  } else if (e.shiftKey){
    S.scrollRow = clamp(S.scrollRow + e.deltaY, 0, S.maxRowScroll);
    drawTimeline();
  } else {
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    S.scrollBeat = clamp(S.scrollBeat + d / pxPerBeat, 0, S.maxScrollBeat);
    drawTimeline();
  }
}, { passive: false });

function scrubTo(mx){
  if (S.playing) stop();
  let b = Math.max(0, beatOf(mx));
  if (S.snap) b = Math.round(b * 4) / 4;
  if (S.selKey && Math.abs(S.selKey.t - b) > 1e-4) S.selKey = null;
  setBeat(b);
}

/* ============================ 复制 / 粘贴 / 右键菜单 ============================ */
let clipboard = null;

function clipName(c){ const a = ACTION_LIB.find(x => x.id === c.actionId); return a ? a.name : "动作"; }

function copySelection(){
  if (S.selClips.length){
    const items = S.selClips.map(c => JSON.parse(JSON.stringify(c)));
    clipboard = { kind: "clips", items };
    toast(items.length > 1 ? "已复制 " + items.length + " 个片段" : "已复制片段「" + clipName(S.selClips[0]) + "」");
    return true;
  }
  if (S.selKeys.length){
    const items = S.selKeys.map(s => ({ partId: s.partId, key: JSON.parse(JSON.stringify(s.key)) }));
    clipboard = { kind: "keys", items };
    toast(items.length > 1 ? "已复制 " + items.length + " 个关键帧" : "已复制关键帧");
    return true;
  }
  toast("先选中片段或关键帧");
  return false;
}

function deleteSelection(){
  if (!hasSel()) return false;
  pushUndo();
  S.selClips.forEach(c => { S.clips = S.clips.filter(x => x !== c); });
  S.selKeys.forEach(s => {
    const p = S.parts.find(x => x.id === s.partId);
    if (p) p.keys = p.keys.filter(k => k !== s.key);
  });
  clearSel();
  applyAt(S.beat); renderAll();
  return true;
}

function cutSelection(){
  if (copySelection()) deleteSelection();
}

function pasteClipboard(){
  if (!clipboard){ toast("剪贴板是空的"); return; }
  const at = S.snap ? Math.round(S.beat * 4) / 4 : S.beat;
  pushUndo();

  if (clipboard.kind === "clips"){
    const items = clipboard.items;
    const t0 = Math.min.apply(null, items.map(c => c.start));
    const single = items.length === 1;
    const made = [];
    items.forEach(src => {
      const target = (single && S.selected) ? S.selected : S.parts.find(p => p.id === src.partId);
      if (!target) return;
      const base = (target.id === src.partId) ? src.base : {
        x: target.x, y: target.y, rot: target.rot,
        sx: target.sx, sy: target.sy, alpha: target.alpha, tex: target.texIndex
      };
      const c = Object.assign({}, JSON.parse(JSON.stringify(src)), {
        base, id: "c" + (++uid), partId: target.id,
        start: Math.max(0, at + (src.start - t0))
      });
      S.clips.push(c);
      made.push(c);
    });
    if (!made.length){ toast("没有可用的目标图层"); return; }
    S.selClips = made; S.selectedClip = made[0];
    S.selKeys = []; S.selKey = null;
    applyAt(S.beat); renderAll();
    toast("已粘贴 " + made.length + " 个片段");
    return;
  }

  const items = clipboard.items;
  const t0 = Math.min.apply(null, items.map(i => i.key.t));
  const single = items.length === 1;
  const made = [];
  items.forEach(it => {
    const target = (single && S.selected) ? S.selected : S.parts.find(p => p.id === it.partId);
    if (!target) return;
    const k = JSON.parse(JSON.stringify(it.key));
    k.t = Math.max(0, at + (it.key.t - t0));
    target.keys = target.keys.filter(x => Math.abs(x.t - k.t) > 1e-3);
    target.keys.push(k);
    target.keys.sort((a, b) => a.t - b.t);
    made.push({ partId: target.id, key: k });
  });
  if (!made.length){ toast("没有可用的目标图层"); return; }
  S.selKeys = made;
  setSelKey(made[made.length - 1].partId, made[made.length - 1].key);
  S.selClips = []; S.selectedClip = null;
  applyAt(S.beat); renderAll();
  toast("已粘贴 " + made.length + " 个关键帧");
}

function duplicateSelection(){
  if (S.selClips.length){
    pushUndo();
    const items = S.selClips.map(c => JSON.parse(JSON.stringify(c)));
    const t0 = Math.min.apply(null, items.map(c => c.start));
    const end = Math.max.apply(null, items.map(c => c.start + c.dur));
    const made = items.map(src => {
      const c = Object.assign({}, src, { id: "c" + (++uid), start: Math.max(0, end + (src.start - t0)) });
      S.clips.push(c);
      return c;
    });
    S.selClips = made; S.selectedClip = made[0];
    S.selKeys = []; S.selKey = null;
    applyAt(S.beat); renderAll();
    toast("已创建 " + made.length + " 个副本");
    return;
  }
  if (S.selKeys.length){
    pushUndo();
    const items = S.selKeys.map(s => ({ partId: s.partId, key: JSON.parse(JSON.stringify(s.key)) }));
    const t0 = Math.min.apply(null, items.map(i => i.key.t));
    const maxT = Math.max.apply(null, items.map(i => i.key.t));
    const made = [];
    items.forEach(it => {
      const p = S.parts.find(x => x.id === it.partId);
      if (!p) return;
      const k = JSON.parse(JSON.stringify(it.key));
      k.t = maxT + 1 + (it.key.t - t0);
      p.keys = p.keys.filter(x => Math.abs(x.t - k.t) > 1e-3);
      p.keys.push(k);
      p.keys.sort((a, b) => a.t - b.t);
      made.push({ partId: p.id, key: k });
    });
    S.selKeys = made; S.selKey = made[made.length - 1];
    S.selClips = []; S.selectedClip = null;
    applyAt(S.beat); renderAll();
    toast("已创建 " + made.length + " 个副本");
    return;
  }
  toast("先选中片段或关键帧");
}

async function importProject(file){
  try{
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.parts)) throw new Error("不是有效的工程文件");

    const parts = [];
    let maxUid = 0;
    for (const raw of data.parts){
      const vs = [];
      for (const v of (raw.variants || [])){
        if (!v.src) continue;
        const img = await loadSrc(v.src);
        const bbox = v.bbox || alphaBBox(img);
        vs.push({
          variant: v.variant || "", img, bbox,
          ax: v.ax !== undefined ? v.ax : bbox.x + bbox.w/2,
          ay: v.ay !== undefined ? v.ay : bbox.y + bbox.h/2,
          thumb: makeThumb(img, bbox)
        });
      }
      if (!vs.length) continue;
      const id = raw.id || nid();
      const m = /^p(\d+)$/.exec(id);
      if (m) maxUid = Math.max(maxUid, +m[1]);
      const p = {
        id, slot: raw.slot || "layer", kind: raw.kind || classify(raw.slot || "layer"),
        variants: vs, texIndex: clamp(Math.round(raw.texIndex || 0), 0, vs.length - 1),
        x: +raw.x || 0, y: +raw.y || 0, rot: +raw.rot || 0,
        sx: raw.sx === undefined ? 1 : +raw.sx, sy: raw.sy === undefined ? 1 : +raw.sy,
        alpha: raw.alpha === undefined ? 1 : +raw.alpha,
        flipX: !!raw.flipX, flipY: !!raw.flipY,
        ax: raw.ax, ay: raw.ay,
        pu: raw.pu === undefined ? 0.5 : +raw.pu, pv: raw.pv === undefined ? 0.5 : +raw.pv,
        parentId: raw.parentId || null,
        keys: (raw.keys || []).map(k => ({ ...k, bend: k.bend ? k.bend.slice() : undefined })),
        mesh: raw.mesh ? { ...raw.mesh } : null,
        spring: raw.spring ? { ...raw.spring } : null,
        bend: raw.bend ? raw.bend.slice() : null,
        visible: raw.visible !== false, locked: !!raw.locked, bbox: vs[0].bbox
      };
      applyPivot(p);
      parts.push(p);
    }
    if (!parts.length) throw new Error("工程里没有可用的图层贴图");

    const oldW = S.doc.w, oldH = S.doc.h;
    S.parts = parts;
    S.doc = (data.doc && data.doc.w > 0 && data.doc.h > 0) ? { w: +data.doc.w, h: +data.doc.h } : { w: oldW, h: oldH };
    S.bg = Object.assign({ type: "color", color: "#14141a", c1: "#1d3346", c2: "#3a1f2e", angle: 135, img: null },
                         data.bg || {});
    S.bg.img = null;
    if (data.bg && data.bg.imgSrc){
      try { S.bg.img = await loadSrc(data.bg.imgSrc); } catch(err){}
    }
    if (S.bg.type === "image" && !S.bg.img) S.bg.type = "color";
    S.bpm = +data.bpm || 120;
    S.sig = +data.sig || 4;
    S.cues = Array.isArray(data.cues) ? data.cues.map(Number) : [];
    S.midi = (data.midi && Array.isArray(data.midi.notes) && data.midi.notes.length)
      ? { name: data.midi.name || "MIDI", ppq: +data.midi.ppq || 480, tempoBpm: +data.midi.tempoBpm || 0,
          durBeat: +data.midi.durBeat || 0, notes: data.midi.notes.map(n => ({ t: +n.t, d: +n.d, pitch: +n.pitch, vel: +n.vel || 90, ch: +n.ch || 0 })),
          pitches: Array.isArray(data.midi.pitches) ? data.midi.pitches.map(Number) : [],
          chans: Array.isArray(data.midi.chans) ? data.midi.chans.map(Number) : [] }
      : null;
    if (S.midi && (!S.midi.pitches.length || !S.midi.chans.length)){
      S.midi.pitches = [...new Set(S.midi.notes.map(n => n.pitch))].sort((a, b) => b - a);
      S.midi.chans = [...new Set(S.midi.notes.map(n => n.ch))].sort((a, b) => a - b);
    }
    S.lip = { partId: (data.lip && data.lip.partId) || null,
              ch: data.lip && data.lip.ch !== undefined ? +data.lip.ch : -1,
              def: data.lip && data.lip.def !== undefined ? +data.lip.def : 0,
              map: (data.lip && data.lip.map) ? { ...data.lip.map } : {} };
    S.clips = (data.clips || []).map(c => ({
      id: "c" + (++uid), partId: c.partId, actionId: c.actionId,
      start: +c.start || 0, dur: +c.dur || 1,
      flipX: !!c.flipX, flipY: !!c.flipY,
      base: Object.assign({ x: 0, y: 0, rot: 0, sx: 1, sy: 1, alpha: 1, tex: 0 }, c.base || {})
    }));
    uid = Math.max(uid, maxUid);

    S.selected = null; S.selectedClip = null; S.selKey = null;
    S.selKeys = []; S.selClips = [];
    S.beat = 0; S.playing = false;
    undoStack.length = 0; redoStack.length = 0;

    applyAt(0); fitView(); renderAll(); syncUndoBtns();
    toast("已导入工程：" + S.parts.length + " 个图层、" + S.clips.length + " 个片段");
  } catch(err){
    console.error(err);
    toast("导入失败：" + (err && err.message ? err.message : err));
  }
}

/* ============================ MIDI / 钢琴窗 / 口型 ============================ */
const pr = document.getElementById("pr");
const pctx = pr.getContext("2d");
let prDrag = false;

const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const noteName = n => NOTE_NAMES[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1);
const isBlackKey = n => [1,3,6,8,10].indexOf(((n % 12) + 12) % 12) >= 0;
const LIP_COLORS = ["#5DCAA5","#F0997B","#9EB8F0","#E0A0D8","#D8C87A","#8FD0E0"];

/* ---------- SMF 解析（只用 ticks/PPQ → 拍，不重建 tempo map） ---------- */
function parseMidi(buf){
  const dv = new DataView(buf);
  let p = 0;
  const tag = n => { let s = ""; for (let i = 0; i < n; i++) s += String.fromCharCode(dv.getUint8(p + i)); p += n; return s; };
  if (dv.byteLength < 14 || tag(4) !== "MThd") throw new Error("不是标准 MIDI 文件");
  const hl = dv.getUint32(p); p += 4;
  const ntr = dv.getUint16(p + 2);
  const div = dv.getInt16(p + 4);
  p += hl;                              // 跳过整个 header body，落到第一个 track 块
  const ppq = div > 0 ? div : 96;

  const vlq = () => {
    let v = 0, c;
    do { c = dv.getUint8(p++); v = (v << 7) | (c & 0x7f); } while (c & 0x80);
    return v;
  };

  const notes = [];
  let maxTick = 0, tempoBpm = 0;

  for (let ti = 0; ti < ntr && p + 8 <= dv.byteLength; ti++){
    const id = tag(4);
    const len = dv.getUint32(p); p += 4;
    const end = Math.min(dv.byteLength, p + len);
    if (id !== "MTrk"){ p = end; continue; }

    let tick = 0, run = 0;
    const open = new Map();
    while (p < end){
      tick += vlq();
      if (tick > maxTick) maxTick = tick;
      let st = dv.getUint8(p);
      if (st & 0x80){ p++; if (st < 0xF0) run = st; }
      else { st = run; if (!st){ p++; continue; } }

      if (st === 0xFF){
        const type = dv.getUint8(p++);
        const l = vlq();
        if (type === 0x51 && l === 3 && !tempoBpm){
          const us = (dv.getUint8(p) << 16) | (dv.getUint8(p + 1) << 8) | dv.getUint8(p + 2);
          if (us > 0) tempoBpm = Math.round(60000000 / us);
        }
        p += l;
        if (type === 0x2F) break;
        continue;
      }
      if (st === 0xF0 || st === 0xF7){ const l = vlq(); p += l; continue; }

      const hi = st & 0xF0, ch = st & 0x0F;
      if (hi === 0x90){
        const pitch = dv.getUint8(p), vel = dv.getUint8(p + 1); p += 2;
        const key = ch * 128 + pitch;
        if (vel > 0) open.set(key, { t: tick, vel });
        else {
          const o = open.get(key);
          if (o){ open.delete(key); notes.push({ t:o.t, d:Math.max(1, tick-o.t), pitch, vel:o.vel, ch }); }
        }
      } else if (hi === 0x80){
        const pitch = dv.getUint8(p); p += 2;
        const key = ch * 128 + pitch;
        const o = open.get(key);
        if (o){ open.delete(key); notes.push({ t:o.t, d:Math.max(1, tick-o.t), pitch, vel:o.vel, ch }); }
      } else if (hi === 0xC0 || hi === 0xD0){ p += 1; }
      else { p += 2; }
    }
    for (const [key, o] of open){
      notes.push({ t:o.t, d:Math.max(1, maxTick - o.t), pitch: key % 128, vel:o.vel, ch: Math.floor(key / 128) });
    }
    p = end;
  }

  if (!notes.length) throw new Error("文件里没有音符");
  notes.sort((a, b) => a.t - b.t || a.pitch - b.pitch);
  const durTick = notes.reduce((m, n) => Math.max(m, n.t + n.d), 0);
  return {
    ppq, tempoBpm,
    notes: notes.map(n => ({ t: n.t / ppq, d: n.d / ppq, pitch: n.pitch, vel: n.vel, ch: n.ch })),
    durBeat: durTick / ppq,
    pitches: [...new Set(notes.map(n => n.pitch))].sort((a, b) => b - a),
    chans: [...new Set(notes.map(n => n.ch))].sort((a, b) => a - b)
  };
}

/* ---------- 口型映射 ---------- */
function lipPart(){ return S.lip.partId ? (S.parts.find(p => p.id === S.lip.partId) || null) : null; }
function midiNotes(){
  if (!S.midi) return [];
  return S.lip.ch < 0 ? S.midi.notes : S.midi.notes.filter(n => n.ch === S.lip.ch);
}
function lipVariantOf(pitch){
  const p = lipPart();
  if (!p) return 0;
  const raw = S.lip.map[String(pitch)];
  const v = raw === undefined ? (S.lip.def | 0) : raw;
  return clamp(v | 0, 0, Math.max(0, p.variants.length - 1));
}
function variantLabel(p, i){
  const v = p && p.variants[i];
  return v ? (v.variant || "贴图 " + (i + 1)) : "—";
}

/* 改映射后：已经生成过口型就自动重烘，否则只刷新预览 */
function afterLipChange(){
  const p = lipPart();
  if (p && S.midi && p.keys.some(k => k.lip)) bakeLip();
  else { drawPianoRoll(); syncMidiUI(true); }
}

function lipAuto(){
  const p = lipPart();
  if (!p) return toast("先在「口型图层」里选一个图层");
  if (!S.midi) return toast("先导入 MIDI");
  if (p.variants.length < 2) return toast("该图层只有 1 张贴图，先加几张不同口型");
  const pitches = [...new Set(midiNotes().map(n => n.pitch))].sort((a, b) => a - b);
  if (!pitches.length) return toast("当前通道没有音符");
  const V = p.variants.length;
  S.lip.map = {};
  pitches.forEach((pitch, i) => {
    S.lip.map[String(pitch)] = Math.round(i / Math.max(1, pitches.length - 1) * (V - 1));
  });
  afterLipChange();
  toast("已把 " + pitches.length + " 个音高分配到 " + V + " 张贴图（点左侧音高名可逐个改）");
}

function cycleLipPitch(pitch){
  const p = lipPart();
  if (!p) return toast("先在「口型图层」里选一个图层");
  const cur = lipVariantOf(pitch);
  const next = (cur + 1) % p.variants.length;
  S.lip.map[String(pitch)] = next;
  afterLipChange();
  toast(noteName(pitch) + " → " + variantLabel(p, next));
}

function bakeLip(){
  const p = lipPart();
  if (!p) return toast("先在「口型图层」里选一个图层");
  if (!S.midi) return toast("先导入 MIDI");
  if (p.variants.length < 2) return toast("该图层至少需要 2 张贴图");
  if (S.clips.some(c => c.partId === p.id)) return toast("该图层有动作片段，先「分解为关键帧」再生成口型");
  const notes = midiNotes();
  if (!notes.length) return toast("当前通道没有音符");
  if (notes.length > 2000) return toast("音符太多（" + notes.length + "），先用通道筛选再生成");

  pushUndo();
  const V = p.variants.length;
  const def = clamp(S.lip.def | 0, 0, V - 1);
  p.keys = p.keys.filter(k => !k.lip);

  const evs = [];
  for (const n of notes){
    evs.push({ t: n.t, tex: lipVariantOf(n.pitch), k: 1 });
    evs.push({ t: n.t + n.d, tex: def, k: 0 });
  }
  evs.sort((a, b) => a.t - b.t || a.k - b.k);

  const merged = [];
  for (const e of evs){
    const t = Math.round(e.t * 1000) / 1000;
    const last = merged[merged.length - 1];
    if (last && Math.abs(last.t - t) < 1e-3) last.tex = e.tex;
    else merged.push({ t, tex: e.tex });
  }

  const snaps = [];
  for (const e of merged){
    applyAt(e.t);
    const s = keySnapshot(p, e.t, { tex: e.tex, ease: { p: null } });
    s.lip = true;
    snaps.push(s);
  }
  for (const s of snaps){
    const ex = p.keys.find(k => Math.abs(k.t - s.t) < 1e-3);
    if (ex){ ex.tex = s.tex; ex.lip = true; }
    else p.keys.push(s);
  }
  p.keys.sort((a, b) => a.t - b.t);
  applyAt(S.beat);
  renderAll();
  toast("「" + p.slot + "」已生成 " + snaps.length + " 个口型关键帧");
}

function clearLipKeys(){
  let n = 0;
  for (const p of S.parts) n += p.keys.filter(k => k.lip).length;
  if (!n) return toast("没有口型关键帧");
  pushUndo();
  for (const p of S.parts) p.keys = p.keys.filter(k => !k.lip);
  applyAt(S.beat); renderAll();
  toast("已删除 " + n + " 个口型关键帧");
}

/* ---------- 钢琴窗绘制 ---------- */
function prLayout(){
  const W = pr.clientWidth || 800, H = pr.clientHeight || 136;
  const list = S.midi ? [...new Set(midiNotes().map(n => n.pitch))].sort((a, b) => b - a) : [];
  const avail = Math.max(10, H - 1);
  const rh = clamp(avail / Math.max(1, Math.min(list.length, 30)), 9, 16);
  const contentH = list.length * rh;
  const maxScroll = Math.max(0, contentH - avail);
  S.prScroll = clamp(S.prScroll || 0, 0, maxScroll);
  return { W, H, list, rh, avail, contentH, maxScroll };
}

function drawPianoRoll(){
  const wrap = document.getElementById("prwrap");
  if (!wrap) return;
  const app = document.getElementById("app");
  if (!S.prOpen){ wrap.classList.remove("open"); if (app) app.classList.remove("propen"); return; }
  wrap.classList.add("open");
  if (app) app.classList.add("propen");

  const dpr = window.devicePixelRatio || 1;
  const { W, H, list, rh } = prLayout();
  if (pr.width !== Math.round(W*dpr) || pr.height !== Math.round(H*dpr)){
    pr.width = Math.round(W*dpr); pr.height = Math.round(H*dpr);
  }
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pctx.clearRect(0, 0, W, H);
  pctx.fillStyle = "#141414"; pctx.fillRect(0, 0, W, H);
  pctx.fillStyle = "#1c1c1c"; pctx.fillRect(0, 0, labelW, H);
  pctx.textAlign = "left";

  if (!S.midi){
    pctx.fillStyle = "#4e4e48";
    pctx.font = "11px -apple-system,sans-serif";
    pctx.fillText("导入 MIDI 后在这里显示音符", labelW + 14, H/2 + 4);
    return;
  }
  const lp = lipPart();
  const dense = rh < 11;

  for (let i = 0; i < list.length; i++){
    const y = 1 + i*rh - S.prScroll;
    if (y + rh < 0 || y > H) continue;
    const pitch = list[i];
    if (isBlackKey(pitch)){
      pctx.fillStyle = "#181818"; pctx.fillRect(labelW, y, W - labelW, rh);
    }
    pctx.strokeStyle = "#1f1f1f";
    pctx.beginPath(); pctx.moveTo(0, y + rh); pctx.lineTo(W, y + rh); pctx.stroke();
    if (rh >= 8){
      const ty = y + rh - (dense ? 1.5 : 2.5);
      pctx.font = (dense ? "8px" : "9px") + " -apple-system,sans-serif";
      const isC = ((pitch % 12) + 12) % 12 === 0;
      if (!dense || isC || i % 4 === 0){
        pctx.fillStyle = isC ? "#a5a59d" : "#7c7c75";
        pctx.fillText(noteName(pitch), 5, ty);
      }
      if (lp && !dense){
        let vn = variantLabel(lp, lipVariantOf(pitch));
        if (vn.length > 7) vn = vn.slice(0, 7);
        pctx.fillStyle = LIP_COLORS[lipVariantOf(pitch) % LIP_COLORS.length];
        pctx.textAlign = "right";
        pctx.fillText(vn, labelW - 6, ty);
        pctx.textAlign = "left";
      }
    }
  }

  pctx.save();
  pctx.beginPath(); pctx.rect(labelW, 0, W - labelW, H); pctx.clip();

  const b0 = Math.max(0, Math.floor(S.scrollBeat * 4) / 4 - 0.25);
  const b1 = S.scrollBeat + S.visibleBeats + 1;
  for (let b = b0; b <= b1; b += 0.25){
    const isBar = Math.abs(b % S.sig) < 1e-6;
    const isBeat = Math.abs(b % 1) < 1e-6;
    if (!isBeat && pxPerBeat < 26) continue;
    pctx.strokeStyle = isBar ? "#333" : (isBeat ? "#262626" : "#1e1e1e");
    pctx.beginPath(); pctx.moveTo(xOf(b), 0); pctx.lineTo(xOf(b), H); pctx.stroke();
  }

  const idxOf = new Map();
  list.forEach((pitch, i) => idxOf.set(pitch, i));
  for (const n of midiNotes()){
    const i = idxOf.get(n.pitch);
    if (i === undefined) continue;
    const y = 1 + i*rh - S.prScroll;
    if (y + rh < 0 || y > H) continue;
    const x1 = xOf(n.t), x2 = xOf(n.t + n.d);
    if (x2 < labelW || x1 > W) continue;
    const bx = Math.max(labelW, x1);
    const bw = Math.min(Math.max(2.5, x2 - x1), W - bx);
    if (bw <= 0) continue;
    const bh = Math.max(3, rh - 2);
    const v = lp ? lipVariantOf(n.pitch) : -1;
    pctx.fillStyle = v >= 0 ? LIP_COLORS[v % LIP_COLORS.length] : "#3f6f8f";
    roundRect(pctx, bx, y + (rh - bh)/2, bw, bh, 1.5);
    pctx.fill();
  }

  const px = xOf(S.beat);
  if (px >= labelW && px <= W){
    pctx.strokeStyle = "rgba(240,240,234,.85)";
    pctx.lineWidth = 1;
    pctx.beginPath(); pctx.moveTo(px, 0); pctx.lineTo(px, H); pctx.stroke();
  }
  pctx.restore();

  pctx.strokeStyle = "#2c2c2c";
  pctx.beginPath(); pctx.moveTo(labelW - .5, 0); pctx.lineTo(labelW - .5, H); pctx.stroke();
}

/* ---------- 钢琴窗交互 ---------- */
pr.addEventListener("pointerdown", e => {
  if (!S.midi) return;
  const r = pr.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (x < labelW){
    const { list, rh } = prLayout();
    const i = Math.floor((y + S.prScroll - 1) / rh);
    const pitch = list[i];
    if (pitch !== undefined) cycleLipPitch(pitch);
    return;
  }
  if (e.button !== 0) return;
  prDrag = true;
  try { pr.setPointerCapture(e.pointerId); } catch(err){}
  scrubTo(x);
});
pr.addEventListener("pointermove", e => {
  if (!prDrag) return;
  const r = pr.getBoundingClientRect();
  scrubTo(e.clientX - r.left);
});
window.addEventListener("pointerup", () => { prDrag = false; });
pr.addEventListener("wheel", e => {
  if (!S.midi) return;
  e.preventDefault();
  if (e.ctrlKey || e.metaKey){
    const r = pr.getBoundingClientRect();
    zoomAt(S.zoom * (e.deltaY < 0 ? 1.15 : 1/1.15), e.clientX - r.left);
    return;
  }
  const { maxScroll } = prLayout();
  S.prScroll = clamp(S.prScroll + e.deltaY, 0, maxScroll);
  drawPianoRoll();
}, { passive: false });

/* ---------- MIDI 工具栏 ---------- */
let midiSig = "";
function syncMidiUI(force){
  const sig = [
    S.midi ? S.midi.name + ":" + S.midi.notes.length + ":" + S.midi.chans.join(",") : "-",
    S.parts.map(p => p.id + ":" + p.slot + ":" + p.variants.length).join("|"),
    S.lip.partId, S.lip.ch, S.lip.def, S.prOpen
  ].join("~");
  if (!force && sig === midiSig) return;
  midiSig = sig;

  document.getElementById("midiName").textContent = S.midi
    ? (S.midi.name || "MIDI") + " · " + S.midi.notes.length + " 音符" + (S.midi.tempoBpm ? " · " + S.midi.tempoBpm + " BPM" : "")
    : "无 MIDI";

  const lpSel = document.getElementById("lipPart");
  lpSel.innerHTML = '<option value="">（不设）</option>' + S.parts.map(p =>
    '<option value="' + p.id + '"' + (p.id === S.lip.partId ? " selected" : "") + '>' +
    esc(p.slot) + " (" + p.variants.length + ")</option>").join("");

  const chSel = document.getElementById("lipCh");
  chSel.innerHTML = '<option value="-1">全部</option>' + (S.midi ? S.midi.chans.map(c =>
    '<option value="' + c + '"' + (c === S.lip.ch ? " selected" : "") + '>Ch ' + (c + 1) +
    " · " + S.midi.notes.filter(n => n.ch === c).length + "</option>").join("") : "");

  const defSel = document.getElementById("lipDef");
  const lp = lipPart();
  defSel.innerHTML = lp
    ? lp.variants.map((v, i) => '<option value="' + i + '"' + (i === (S.lip.def | 0) ? " selected" : "") + '>' +
        esc(v.variant || "贴图 " + (i + 1)) + "</option>").join("")
    : '<option value="0">—</option>';
  defSel.disabled = !lp;

  document.getElementById("btnPrToggle").textContent = S.prOpen ? "钢琴窗 ▼" : "钢琴窗 ▲";
}

function setPrOpen(v){
  S.prOpen = !!v;
  const app = document.getElementById("app");
  const wrap = document.getElementById("prwrap");
  if (app) app.classList.toggle("propen", S.prOpen);
  if (wrap) wrap.classList.toggle("open", S.prOpen);   // 先定高度再量，否则时间轴会按旧高度排版
  drawTimeline(); syncMidiUI(true);
}

async function loadMidiFile(f){
  try {
    const m = parseMidi(await f.arrayBuffer());
    m.name = f.name.replace(/\.[^.]+$/, "");
    pushUndo();
    S.midi = m;
    S.lip.ch = m.chans.length === 1 ? m.chans[0] : -1;
    S.prScroll = 0;
    S.prOpen = true;
    document.getElementById("app").classList.add("propen");
    if (!S.lip.partId){
      const guess = S.parts.find(p => p.variants.length > 1 && /mouth|嘴|口|lip/i.test(p.slot)) ||
                    S.parts.find(p => p.variants.length > 1);
      if (guess) S.lip.partId = guess.id;
    }
    renderAll(); syncMidiUI(true);
    toast("MIDI：" + m.notes.length + " 个音符 / " + m.chans.length + " 通道" +
          (m.tempoBpm ? " · 原速 " + m.tempoBpm + " BPM" : "") + "，选中口型图层后点「生成口型」");
  } catch(err){
    console.error(err);
    toast("MIDI 读取失败：" + (err && err.message ? err.message : err));
  }
}

/* ============================ 快捷键 ============================ */
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;

  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "z"){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === "y"){ e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === "c"){ e.preventDefault(); copySelection(); return; }
  if (mod && e.key.toLowerCase() === "x"){ e.preventDefault(); cutSelection(); return; }
  if (mod && e.key.toLowerCase() === "v"){ e.preventDefault(); pasteClipboard(); return; }
  if (mod && e.key.toLowerCase() === "d"){ e.preventDefault(); duplicateSelection(); return; }

  if (e.code === "Space"){ e.preventDefault(); togglePlay(); }
  else if (e.key === "t" || e.key === "T"){ document.getElementById("btnCue").click(); }
  else if (e.key === "h" || e.key === "H"){ e.shiftKey ? mirrorSelection("x") : (S.selected && flipPart(S.selected, "x")); }
  else if (e.key === "v" || e.key === "V"){ e.shiftKey ? mirrorSelection("y") : (S.selected && flipPart(S.selected, "y")); }
  else if (e.key === "Delete" || e.key === "Backspace"){
    if (hasSel()){
      e.preventDefault();
      deleteSelection();
    }
  }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); setBeat(S.beat - (e.shiftKey ? 1 : 0.25)); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); setBeat(S.beat + (e.shiftKey ? 1 : 0.25)); }
});

/* ============================ 拖放导入 ============================ */
const dropZone = document.getElementById("dropZone");
let dragDepth = 0;

function hasFiles(e){
  const dt = e.dataTransfer;
  if (!dt || !dt.types) return false;
  return Array.prototype.indexOf.call(dt.types, "Files") >= 0;
}

window.addEventListener("dragenter", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth++;
  dropZone.classList.add("on");
});
window.addEventListener("dragover", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "copy";
});
window.addEventListener("dragleave", e => {
  if (!hasFiles(e)) return;
  dragDepth--;
  if (dragDepth <= 0){ dragDepth = 0; dropZone.classList.remove("on"); }
});
const AUDIO_EXT = /\.(mp3|wav|ogg|oga|m4a|aac|flac|opus|weba|aiff?|wma)$/i;
const IMAGE_EXT = /\.(png|jpe?g|webp|gif|bmp|svg|avif|tiff?)$/i;
const MIDI_EXT = /\.(mid|midi)$/i;
function isAudioFile(f){ return !!((f.type && f.type.startsWith("audio/")) || AUDIO_EXT.test(f.name || "")); }
function isImageFile(f){ return !!((f.type && f.type.startsWith("image/")) || IMAGE_EXT.test(f.name || "")); }
function isMidiFile(f){ return !!((f.type && /midi/i.test(f.type)) || MIDI_EXT.test(f.name || "")); }

window.addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  dropZone.classList.remove("on");
  const files = Array.from(e.dataTransfer.files || []);
  const audios = files.filter(isAudioFile);
  const images = files.filter(isImageFile);
  const midis = files.filter(isMidiFile);

  if (midis.length) loadMidiFile(midis[0]);
  if (audios.length) loadAudioFile(audios[0]);
  if (images.length) addFiles(images);
  if (!audios.length && !images.length && !midis.length) toast("不支持的文件类型");
});

function loadAudioFile(f){
  try {
    S.audio = new Audio(URL.createObjectURL(f));
    S.audio.onloadedmetadata = () => {
      S.audioDur = S.audio.duration || 0;
      drawTimeline(); updateTime(); renderInspector();
    };
    S.audio.onerror = () => toast("这个音频格式浏览器无法解码");
    S.audioName = f.name || "音频";
    toast("已导入音乐：" + (f.name || "").slice(0, 24));
  } catch(err){
    toast("音频导入失败");
  }
}

/* ============================ 视频导出 ============================ */
function tick(){ return new Promise(r => setTimeout(r, 0)); }

function projectEndBeat(){
  const lastKey = S.parts.reduce((m, p) => p.keys.reduce((mm, k) => Math.max(mm, k.t), m), 0);
  const lastCue = S.cues.reduce((m, c) => Math.max(m, c), 0);
  const clipEnd = S.clips.reduce((m, c) => Math.max(m, c.start + c.dur), 0);
  const midiEnd = S.midi ? (S.midi.durBeat || 0) : 0;
  return Math.max(lastKey, lastCue, clipEnd, midiEnd, S.sig);
}
function projectDuration(){
  return S.audio && S.audioDur > 0 ? S.audioDur : projectEndBeat() * 60 / S.bpm;
}

function renderExportFrame(g, W, H, scale){
  const old = S.view;
  S.view = { scale, ox: 0, oy: 0 };
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = "#000";
  g.fillRect(0, 0, W, H);
  drawBackground(g, true);
  for (const p of S.parts){
    if (!p.visible) continue;
    const it = p.variants[p.texIndex] || p.variants[0];
    if (!it) continue;
    paintPart(g, p, it, worldOf(p));
  }
  S.view = old;
}

/* ---- EBML / WebM ---- */
function ebCat(list){
  let len = 0;
  for (const b of list) len += b.length;
  const out = new Uint8Array(len);
  let o = 0;
  for (const b of list){ out.set(b, o); o += b.length; }
  return out;
}
function ebSize(n){
  let len = 1;
  while (len < 8 && n >= Math.pow(2, 7 * len) - 1) len++;
  const b = new Uint8Array(len);
  let v = n;
  for (let i = len - 1; i >= 0; i--){ b[i] = v & 0xff; v = Math.floor(v / 256); }
  b[0] |= 0x80 >> (len - 1);
  return b;
}
function ebEl(id, payload){
  return ebCat([new Uint8Array(id), ebSize(payload.length), payload]);
}
function ebUint(id, val){
  const bytes = [];
  let v = Math.max(0, Math.floor(val));
  do { bytes.unshift(v & 0xff); v = Math.floor(v / 256); } while (v > 0);
  return ebEl(id, new Uint8Array(bytes));
}
function ebFloat(id, val){
  const b = new Uint8Array(8);
  new DataView(b.buffer).setFloat64(0, val);
  return ebEl(id, b);
}
function ebStr(id, s){
  return ebEl(id, new TextEncoder().encode(s));
}
function opusHead(ch, sr, preSkip){
  const b = new Uint8Array(19);
  b.set([0x4F, 0x70, 0x75, 0x73, 0x48, 0x65, 0x61, 0x64], 0);
  b[8] = 1; b[9] = ch;
  b[10] = preSkip & 0xff; b[11] = (preSkip >> 8) & 0xff;
  b[12] = sr & 0xff; b[13] = (sr >> 8) & 0xff; b[14] = (sr >> 16) & 0xff; b[15] = (sr >> 24) & 0xff;
  b[16] = 0; b[17] = 0; b[18] = 0;
  return b;
}

function buildWebM(o){
  const ebml = ebEl([0x1A,0x45,0xDF,0xA3], ebCat([
    ebUint([0x42,0x86], 1),
    ebUint([0x42,0xF7], 1),
    ebUint([0x42,0xF2], 4),
    ebUint([0x42,0xF3], 8),
    ebStr([0x42,0x82], "webm"),
    ebUint([0x42,0x87], 4),
    ebUint([0x42,0x85], 2)
  ]));

  const info = ebEl([0x15,0x49,0xA9,0x66], ebCat([
    ebUint([0x2A,0xD7,0xB1], 1000000),
    ebStr([0x4D,0x80], "rigframe"),
    ebStr([0x57,0x41], "rigframe"),
    ebFloat([0x44,0x89], o.durationMs)
  ]));

  const vTrack = ebEl([0xAE], ebCat([
    ebUint([0xD7], 1),
    ebUint([0x73,0xC5], 1),
    ebUint([0x83], 1),
    ebUint([0x23,0xE3,0x83], Math.round(1e9 / o.fps)),
    ebStr([0x86], o.vCodecId),
    ebEl([0xE0], ebCat([ebUint([0xB0], o.width), ebUint([0xBA], o.height)]))
  ]));

  const trackEntries = [vTrack];
  if (o.hasAudio){
    trackEntries.push(ebEl([0xAE], ebCat([
      ebUint([0xD7], 2),
      ebUint([0x73,0xC5], 2),
      ebUint([0x83], 2),
      ebStr([0x86], "A_OPUS"),
      ebEl([0x63,0xA2], opusHead(2, 48000, 312)),
      ebEl([0xE1], ebCat([ebFloat([0xB5], 48000), ebUint([0x9F], 2)]))
    ])));
  }
  const tracks = ebEl([0x16,0x54,0xAE,0x6B], ebCat(trackEntries));

  const blocks = [];
  o.video.forEach(c => blocks.push({ ts: Math.round(c.ts / 1000), track: 1, data: c.data, key: !!c.key }));
  if (o.hasAudio) o.audio.forEach(c => blocks.push({ ts: Math.round(c.ts / 1000), track: 2, data: c.data, key: true }));
  blocks.sort((a, b) => a.ts - b.ts || a.track - b.track);

  const clusters = [];
  let cur = null;
  for (const b of blocks){
    const needNew = !cur || (b.ts - cur.ts) > 1000 || (b.track === 1 && b.key && b.ts > cur.ts && cur.blocks.length);
    if (needNew){
      if (cur) clusters.push(cur);
      cur = { ts: b.ts, blocks: [] };
    }
    cur.blocks.push(b);
  }
  if (cur) clusters.push(cur);

  const clusterEls = clusters.map(c => {
    const parts = [ebUint([0xE7], c.ts)];
    for (const b of c.blocks){
      const rel = b.ts - c.ts;
      const hdr = new Uint8Array(4);
      hdr[0] = 0x80 | b.track;
      hdr[1] = (rel >> 8) & 0xff;
      hdr[2] = rel & 0xff;
      hdr[3] = b.key ? 0x80 : 0x00;
      parts.push(ebEl([0xA3], ebCat([hdr, b.data])));
    }
    return ebEl([0x1F,0x43,0xB6,0x75], ebCat(parts));
  });

  const segment = ebEl([0x18,0x53,0x80,0x67], ebCat([info, tracks].concat(clusterEls)));
  return ebCat([ebml, segment]);
}

async function encodeAudioOpus(onProgress, start, dur){
  if (!S.audio || !S.audioDur) return null;
  const res = await fetch(S.audio.src);
  const raw = await res.arrayBuffer();
  const ac = new AudioContext();
  const buf = await ac.decodeAudioData(raw);
  await ac.close();

  const SR = 48000;
  const ch = Math.min(2, buf.numberOfChannels);
  const off = new OfflineAudioContext(2, Math.ceil(buf.duration * SR), SR);
  const src = off.createBufferSource();
  src.buffer = buf;
  src.connect(off.destination);
  src.start();
  const rendered = await off.startRendering();
  const L = rendered.getChannelData(0);
  const R = rendered.numberOfChannels > 1 ? rendered.getChannelData(1) : L;
  const from = Math.max(0, Math.floor((start || 0) * SR));
  const want = Math.max(0, Math.floor((dur || rendered.duration) * SR));

  const chunks = [];
  const enc = new AudioEncoder({
    output: (chunk) => {
      const d = new Uint8Array(chunk.byteLength);
      chunk.copyTo(d);
      chunks.push({ ts: chunk.timestamp, data: d });
    },
    error: (e) => { console.warn("audio encode", e); }
  });
  await enc.configure({ codec: "opus", sampleRate: SR, numberOfChannels: 2, bitrate: 128000 });

  const N = 960;
  const total = Math.max(0, Math.min(rendered.length - from, want));
  for (let i = 0; i < total; i += N){
    const n = Math.min(N, total - i);
    const src = from + i;
    const data = new Float32Array(n * 2);
    data.set(L.subarray(src, src + n), 0);
    data.set(R.subarray(src, src + n), n);
    const ad = new AudioData({
      format: "f32-planar", sampleRate: SR, numberOfFrames: n, numberOfChannels: 2,
      timestamp: Math.round(i / SR * 1e6), data
    });
    enc.encode(ad);
    ad.close();
    if (i % (N * 40) === 0){ if (onProgress) onProgress(i / total * 0.25); await tick(); }
  }
  await enc.flush();
  enc.close();
  let out = chunks;
  if (out.length){
    const t0 = out[0].ts;
    if (t0 > 0) out.forEach(c => { c.ts -= t0; });
  }
  const offUs = Math.round((S.audioOffset || 0) * 1e6);
  if (offUs !== 0){
    out.forEach(c => { c.ts += offUs; });
    out = out.filter(c => c.ts >= 0);
  }
  return out;
}

async function exportVideo(opts, onProgress, onStatus){
  const W = Math.round(S.doc.w * opts.scale);
  const H = Math.round(S.doc.h * opts.scale);
  if (W < 16 || H < 16) throw new Error("画布尺寸太小");
  const w = W - (W % 2), h = H - (H % 2);
  const scale = opts.scale;

  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const g = canvas.getContext("2d");

  let vCodec = "vp09.00.10.08", vCodecId = "V_VP9";
  let supported = false;
  try {
    const s = await VideoEncoder.isConfigSupported({ codec: vCodec, width: w, height: h, bitrate: opts.bitrate, framerate: opts.fps });
    supported = !!(s && s.supported);
  } catch(e){ supported = false; }
  if (!supported){
    vCodec = "vp8"; vCodecId = "V_VP8";
    const s2 = await VideoEncoder.isConfigSupported({ codec: vCodec, width: w, height: h, bitrate: opts.bitrate, framerate: opts.fps });
    if (!s2 || !s2.supported) throw new Error("浏览器不支持 WebCodecs 视频编码");
  }

  onStatus && onStatus("编码音频…");
  let audioChunks = null;
  try { audioChunks = await encodeAudioOpus(onProgress, opts.start || 0, opts.duration); } catch(e){ console.warn(e); }

  onStatus && onStatus("编码画面…");
  const videoChunks = [];
  const venc = new VideoEncoder({
    output: (chunk) => {
      const d = new Uint8Array(chunk.byteLength);
      chunk.copyTo(d);
      videoChunks.push({ ts: chunk.timestamp, data: d, key: chunk.type === "key" });
    },
    error: (e) => { console.warn("video encode", e); }
  });
  await venc.configure({ codec: vCodec, width: w, height: h, bitrate: opts.bitrate, framerate: opts.fps, latencyMode: "quality" });

  const dur = opts.duration;
  const frames = Math.max(1, Math.round(dur * opts.fps));
  const gop = Math.max(1, Math.round(opts.fps * 2));
  const savedBeat = S.beat;

  for (let i = 0; i < frames; i++){
    const t = i / opts.fps;
    applyAt(((opts.start || 0) + t) * S.bpm / 60);
    renderExportFrame(g, w, h, scale);
    const vf = new VideoFrame(canvas, {
      timestamp: Math.round(t * 1e6),
      duration: Math.round(1e6 / opts.fps)
    });
    venc.encode(vf, { keyFrame: i % gop === 0 });
    vf.close();
    if (i % 4 === 0){
      onProgress && onProgress(0.25 + (i / frames) * 0.65);
      await tick();
    }
  }
  await venc.flush();
  venc.close();

  applyAt(savedBeat);
  onStatus && onStatus("封装文件…");
  const bytes = buildWebM({
    width: w, height: h, fps: opts.fps,
    vCodecId, durationMs: Math.round(dur * 1000),
    video: videoChunks,
    audio: audioChunks || [],
    hasAudio: !!(audioChunks && audioChunks.length)
  });
  onProgress && onProgress(1);
  return new Blob([bytes], { type: "video/webm" });
}

/* ---- 导出界面 ---- */
function openExport(){
  if (!S.parts.length){ toast("还没有图层可以导出"); return; }
  const m = document.getElementById("expModal");
  const total = projectDuration();
  document.getElementById("expStart").value = "0";
  document.getElementById("expEnd").value = total.toFixed(2);
  document.getElementById("expDur").textContent = total.toFixed(2) + " 秒";
  document.getElementById("expAud").textContent = S.audio ? "包含音乐" : "无音频";
  document.getElementById("expBar").style.width = "0%";
  document.getElementById("expStatus").textContent = "准备就绪";
  document.getElementById("expOk").disabled = false;
  syncExpPx();
  m.classList.add("show");
}

function syncExpPx(){
  const scale = +document.getElementById("expScale").value;
  const w = Math.round(S.doc.w * scale), h = Math.round(S.doc.h * scale);
  document.getElementById("expPx").textContent = (w - w % 2) + " × " + (h - h % 2);
}
document.getElementById("expScale").onchange = syncExpPx;

async function doExport(){
  const fps = +document.getElementById("expFps").value;
  const scale = +document.getElementById("expScale").value;
  const okBtn = document.getElementById("expOk");
  const bar = document.getElementById("expBar");
  const st = document.getElementById("expStatus");
  const total = projectDuration();
  let start = Math.max(0, +document.getElementById("expStart").value || 0);
  let end = Math.min(total, +document.getElementById("expEnd").value || total);
  if (end <= start + 0.05){ end = total; start = 0; }
  okBtn.disabled = true;

  try {
    const blob = await exportVideo(
      { fps, scale, duration: end - start, start, end,
        bitrate: Math.round(S.doc.w * S.doc.h * scale * scale * 0.12) },
      p => { bar.style.width = Math.round(p * 100) + "%"; },
      s => { st.textContent = s; }
    );
    const name = "rigframe-" + Date.now().toString(36) + ".webm";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    st.textContent = "完成：" + (blob.size / 1048576).toFixed(2) + " MB";
    bar.style.width = "100%";
    okBtn.disabled = false;
    setTimeout(() => document.getElementById("expModal").classList.remove("show"), 900);
    toast("已导出 " + name);
  } catch(e){
    console.error(e);
    st.textContent = "导出失败：" + (e && e.message ? e.message : e);
    okBtn.disabled = false;
  }
}

document.getElementById("expOk").onclick = doExport;
document.getElementById("expCancel").onclick = () => document.getElementById("expModal").classList.remove("show");
